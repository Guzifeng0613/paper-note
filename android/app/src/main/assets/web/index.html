#deskEditEmpty .desk-empty-new{padding:10px 22px;border-radius:11px;background:var(--pine);color:#fff;
  font-weight:700;font-size:14px}
#deskEditEmpty .desk-empty-new:hover{background:var(--pine-d)}

/* 覆盖层（设置/回收站/网盘等）宽屏内容居中 */
.platform-desktop .screen:not(#scr-home):not(#scr-edit) .topbar{
  align-self:center;width:100%;max-width:920px}
.platform-desktop .screen:not(#scr-home):not(#scr-edit) .screen-body{
  display:flex;justify-content:center}
.platform-desktop .screen:not(#scr-home):not(#scr-edit) .screen-body>*{
  width:100%;max-width:880px}
/* 仅桌面显示的控件（如 AI 对话返回键） */
.desk-only{display:none}
.platform-desktop .desk-only{display:inline-flex;align-items:center;justify-content:center}
/* ============================================================
   vault-ui.css —— 纸片 v16 新 UI 样式（暖纸克制风，类 Obsidian）
   全部以 v16- 前缀命名，独立于旧样式；深浅色均适配。
   复用旧 tokens 的动效变量 --dur-*/--ease-*。
   ============================================================ */
/* 变量挂在 :root（而非 #v16root），保证始终进 cssOM */
:root{
  --vp-paper:#ECEAE2; --vp-paper-2:#F3F1E8; --vp-card:#FBFAF4;
  --vp-ink:#3A3732; --vp-ink-2:#7C766B; --vp-ink-3:#ACA598;
  --vp-line:rgba(96,84,60,.14);
  --vp-accent:#A8843C; --vp-accent-soft:#EFE4C9;
  --vp-shadow:0 1px 2px rgba(90,80,60,.06), 0 6px 18px rgba(90,80,60,.08);
  --vp-shadow-lg:0 4px 10px rgba(90,80,60,.10), 0 16px 40px rgba(90,80,60,.14);
  --vp-r:16px; --vp-r-sm:12px;
  --vp-c-yellow:#FBF0C8; --vp-c-green:#DCEBD2; --vp-c-blue:#D8E4F2;
  --vp-c-pink:#F6DDE0; --vp-c-orange:#F6E0C6; --vp-c-cream:#F1EDE2;
}
:root[data-theme="dark"]{
  --vp-paper:#18191C; --vp-paper-2:#202126; --vp-card:#26272C;
  --vp-ink:#E8E6E1; --vp-ink-2:#A7A29A; --vp-ink-3:#6E6A63;
  --vp-line:rgba(255,255,255,.09);
  --vp-accent:#D3B266; --vp-accent-soft:rgba(211,178,102,.16);
  --vp-shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --vp-shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
  --vp-c-yellow:#4A4226; --vp-c-green:#33442E; --vp-c-blue:#2C3A4E;
  --vp-c-pink:#4A3036; --vp-c-orange:#4A3826; --vp-c-cream:#2C2D31;
}
#v16root{
  /* 暖纸配色 */
  --vp-paper:#ECEAE2; --vp-paper-2:#F3F1E8; --vp-card:#FBFAF4;
  --vp-ink:#3A3732; --vp-ink-2:#7C766B; --vp-ink-3:#ACA598;
  --vp-line:rgba(96,84,60,.14);
  --vp-accent:#A8843C; --vp-accent-soft:#EFE4C9;
  --vp-shadow:0 1px 2px rgba(90,80,60,.06), 0 6px 18px rgba(90,80,60,.08);
  --vp-shadow-lg:0 4px 10px rgba(90,80,60,.10), 0 16px 40px rgba(90,80,60,.14);
  --vp-r:16px; --vp-r-sm:12px;
  --vp-c-yellow:#FBF0C8; --vp-c-green:#DCEBD2; --vp-c-blue:#D8E4F2;
  --vp-c-pink:#F6DDE0; --vp-c-orange:#F6E0C6; --vp-c-cream:#F1EDE2;

  position:fixed; left:0; right:0; top:0; bottom:0; z-index:60;
  width:100%; height:100%;
  background:#ECEAE2; color:var(--vp-ink);
  display:flex; flex-direction:column; overflow:hidden;
  font-family:var(--font-base);
}
:root[data-theme="dark"] #v16root{
  background:#18191C;
  --vp-paper:#18191C; --vp-paper-2:#202126; --vp-card:#26272C;
  --vp-ink:#E8E6E1; --vp-ink-2:#A7A29A; --vp-ink-3:#6E6A63;
  --vp-line:rgba(255,255,255,.09);
  --vp-accent:#D3B266; --vp-accent-soft:rgba(211,178,102,.16);
  --vp-shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --vp-shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
  --vp-c-yellow:#4A4226; --vp-c-green:#33442E; --vp-c-blue:#2C3A4E;
  --vp-c-pink:#4A3036; --vp-c-orange:#4A3826; --vp-c-cream:#2C2D31;
}

/* ---------- 屏幕切换 ---------- */
.v16-scr{ position:absolute; inset:0; display:flex; flex-direction:column;
  background:var(--vp-paper); opacity:0; visibility:hidden; pointer-events:none;
  transform:translateX(28px); transition:transform var(--dur-4) var(--ease-decel),
  opacity var(--dur-3) ease, visibility var(--dur-3); }
.v16-scr.on{ opacity:1; visibility:visible; pointer-events:auto; transform:none; z-index:2; }
.v16-scr.behind{ opacity:1; visibility:visible; transform:none; pointer-events:none; z-index:1; }
@media (prefers-reduced-motion:reduce){
  .v16-scr{ transition:none !important; transform:none !important; }
}

/* ---------- 顶栏 ---------- */
.v16-topbar{ display:flex; align-items:center; gap:10px; flex-shrink:0;
  padding:12px 16px 10px; padding-top:max(12px, calc(env(safe-area-inset-top,0px) + 8px));
  min-height:58px; }
.v16-ic{ width:38px; height:38px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; color:var(--vp-ink-2);
  transition:transform .18s var(--ease-spring), background .2s; }
.v16-ic:active{ transform:scale(.88); background:var(--vp-accent-soft); }
.v16-ic svg{ width:21px; height:21px; }
.v16-crumbs{ flex:1; min-width:0; display:flex; align-items:center; gap:4px;
  overflow-x:auto; scrollbar-width:none; font-size:15px; font-weight:700; }
.v16-crumbs::-webkit-scrollbar{ display:none; }
.v16-crumbs .cr{ flex-shrink:0; color:var(--vp-ink-2); font-weight:600; }
.v16-crumbs .cr.cur{ color:var(--vp-ink); }
.v16-crumbs .sep{ color:var(--vp-ink-3); font-size:13px; flex-shrink:0; }
.v16-crumbs .home-ico{ width:18px; height:18px; flex-shrink:0; color:var(--vp-accent); }

/* 视图切换条 */
.v16-viewbar{ display:flex; align-items:center; gap:8px; padding:2px 16px 10px; flex-shrink:0; }
.v16-vb-label{ font-size:13px; color:var(--vp-ink-3); font-weight:600; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.v16-seg{ display:flex; background:var(--vp-paper-2); border-radius:19px; padding:3px; }
.v16-seg button{ width:34px; height:30px; border-radius:16px; display:flex; align-items:center;
  justify-content:center; color:var(--vp-ink-3); transition:background .2s,color .2s; }
.v16-seg button.on{ background:var(--vp-card); color:var(--vp-accent); box-shadow:var(--vp-shadow); }
.v16-seg button svg{ width:17px; height:17px; }

/* ---------- 主区 ---------- */
.v16-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  padding:4px 16px calc(90px + var(--safe-b,0px)); }

/* 文件夹卡片 */
.v16-folders{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:6px; }
.v16-folder-card{ display:flex; align-items:center; gap:12px; background:var(--vp-card);
  border-radius:var(--vp-r); padding:14px; box-shadow:var(--vp-shadow); cursor:pointer;
  transition:transform var(--dur-2) var(--ease-spring), box-shadow .2s; }
.v16-folder-card:active{ transform:scale(.96); }
.v16-folder-card .fic{ width:38px; height:38px; border-radius:11px; background:var(--vp-accent-soft);
  color:var(--vp-accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.v16-folder-card .fic svg{ width:22px; height:22px; }
.v16-folder-card .fname{ font-size:14.5px; font-weight:700; line-height:1.2; }
.v16-folder-card .fcnt{ font-size:12px; color:var(--vp-ink-3); margin-top:2px; }

/* md 卡片：网格 */
.v16-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.v16-note-card{ position:relative; background:var(--vp-card); border-radius:var(--vp-r);
  padding:14px 14px 12px; box-shadow:var(--vp-shadow); cursor:pointer;
  transition:transform var(--dur-2) var(--ease-spring), box-shadow .2s;
  border-left:3px solid transparent; }
.v16-note-card:active{ transform:scale(.96); }
.v16-note-card.c-yellow{ background:var(--vp-c-yellow); }
.v16-note-card.c-green{ background:var(--vp-c-green); }
.v16-note-card.c-blue{ background:var(--vp-c-blue); }
.v16-note-card.c-pink{ background:var(--vp-c-pink); }
.v16-note-card.c-orange{ background:var(--vp-c-orange); }
.v16-note-card .nt{ font-size:15px; font-weight:800; line-height:1.3; padding-right:20px;
  display:flex; align-items:center; gap:5px; }
.v16-note-card .nt .pin{ width:14px; height:14px; color:var(--vp-accent); flex-shrink:0; }
.v16-note-card .ns{ font-size:12.5px; color:var(--vp-ink-2); line-height:1.5; margin-top:7px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.v16-note-card .nfoot{ display:flex; align-items:center; gap:6px; margin-top:10px;
  font-size:11.5px; color:var(--vp-ink-3); }
.v16-note-card .ntag{ background:rgba(120,110,80,.14); padding:1px 7px; border-radius:8px;
  font-weight:600; }
.v16-note-card .nfoot .dot{ margin-left:auto; }
.v16-note-card .selmark{ position:absolute; top:12px; right:12px; width:22px; height:22px;
  border-radius:50%; border:2px solid var(--vp-ink-3); display:none; align-items:center; justify-content:center; }
.v16-home.selecting .v16-note-card .selmark{ display:flex; }
.v16-home.selecting .v16-note-card{ border-color:var(--vp-accent); }
.v16-note-card.sel .selmark{ background:var(--vp-accent); border-color:var(--vp-accent); }
.v16-note-card.sel .selmark svg{ width:12px; height:12px; color:#fff; }

/* 列表视图 */
.v16-list{ display:flex; flex-direction:column; gap:10px; }
.v16-list .v16-note-card{ display:block; border-left-width:4px; }

/* 空态 */
.v16-empty{ padding:60px 30px; text-align:center; color:var(--vp-ink-3); }
.v16-empty svg{ width:60px; height:60px; opacity:.5; margin-bottom:14px; }
.v16-empty p{ font-size:14px; }

/* ---------- FAB ---------- */
.v16-fab{ position:absolute; right:18px; bottom:calc(22px + var(--safe-b,0px));
  width:58px; height:58px; border-radius:18px; background:var(--vp-accent); color:#fff;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--vp-shadow-lg);
  z-index:8; transition:transform var(--dur-3) var(--ease-spring), background .2s; }
.v16-fab svg{ width:26px; height:26px; transition:transform var(--dur-3) var(--ease-spring); }
.v16-fab.open{ transform:rotate(135deg); }
.v16-fab:active{ transform:scale(.9); }
.v16-fab-menu{ position:absolute; right:24px; bottom:calc(92px + var(--safe-b,0px)); z-index:7;
  display:flex; flex-direction:column; gap:10px; align-items:flex-end;
  opacity:0; visibility:hidden; transform:translateY(10px);
  transition:opacity var(--dur-2) ease, transform var(--dur-2) var(--ease-spring), visibility var(--dur-2); }
.v16-fab-menu.open{ opacity:1; visibility:visible; transform:none; }
.v16-fab-item{ display:flex; align-items:center; gap:9px; background:var(--vp-card);
  border-radius:14px; padding:9px 12px; box-shadow:var(--vp-shadow); font-size:13.5px; font-weight:700;
  color:var(--vp-ink); white-space:nowrap; }
.v16-fab-item svg{ width:18px; height:18px; color:var(--vp-accent); }

/* ---------- 左侧抽屉：文件树 ---------- */
.v16-drawer-mask{ position:absolute; inset:0; z-index:10; background:rgba(40,36,28,.34);
  opacity:0; visibility:hidden; transition:opacity var(--dur-3) ease, visibility var(--dur-3); }
.v16-drawer-mask.open{ opacity:1; visibility:visible; }
.v16-drawer{ position:absolute; left:0; top:0; bottom:0; width:78%; max-width:320px; z-index:11;
  background:var(--vp-paper-2); display:flex; flex-direction:column;
  transform:translateX(-100%); transition:transform var(--dur-4) var(--ease-decel);
  box-shadow:var(--vp-shadow-lg); }
.v16-drawer.open{ transform:none; }
.v16-dr-head{ display:flex; align-items:center; gap:10px; padding:16px 18px;
  padding-top:max(16px, calc(env(safe-area-inset-top,0px) + 10px)); }
.v16-dr-head .dt{ font-size:17px; font-weight:800; flex:1; }
.v16-dr-scroll{ flex:1; overflow-y:auto; padding:4px 10px 20px; }
.v16-tree-node{ font-size:14px; }
.v16-tree-row{ display:flex; align-items:center; gap:6px; padding:9px 10px; border-radius:10px;
  cursor:pointer; color:var(--vp-ink); }
.v16-tree-row:active{ background:var(--vp-accent-soft); }
.v16-tree-row.on{ background:var(--vp-accent-soft); color:var(--vp-accent); font-weight:700; }
.v16-tree-row .tw{ width:20px; height:20px; display:flex; align-items:center; justify-content:center;
  color:var(--vp-ink-3); transition:transform var(--dur-2) var(--ease-decel); flex-shrink:0; }
.v16-tree-row .tw svg{ width:14px; height:14px; }
.v16-tree-row.openfolder .tw{ transform:rotate(90deg); }
.v16-tree-row .ticon{ width:18px; height:18px; color:var(--vp-accent); flex-shrink:0; }
.v16-tree-row .tname{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.v16-tree-row .tcnt{ font-size:11.5px; color:var(--vp-ink-3); }
.v16-children{ margin-left:16px; overflow:hidden;
  transition:max-height var(--dur-3) var(--ease-decel); max-height:0; }
.v16-children.open{ max-height:600px; }
.v16-dr-foot{ padding:10px 18px calc(12px + var(--safe-b,0px)); border-top:1px solid var(--vp-line); }
.v16-dr-foot button{ width:100%; padding:11px; border-radius:12px; background:var(--vp-accent-soft);
  color:var(--vp-accent); font-weight:700; font-size:13.5px; }

/* ---------- 编辑器 ---------- */
.v16-ed-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 20px calc(90px + var(--safe-b,0px)); }
.v16-ed-crumb{ font-size:12.5px; color:var(--vp-ink-3); margin-bottom:6px; display:flex; align-items:center; gap:5px; }
.v16-ed-crumb .mv{ margin-left:auto; color:var(--vp-accent); font-weight:700; }
.v16-ed-title{ width:100%; font-size:26px; font-weight:800; line-height:1.3; margin:6px 0 4px;
  color:var(--vp-ink); font-family:"Noto Serif SC",serif; }
.v16-ed-meta{ font-size:12px; color:var(--vp-ink-3); margin-bottom:14px; }
.v16-ed-body{ font-size:15.5px; line-height:1.75; color:var(--vp-ink); }
.v16-ed-body .md-p{ margin:10px 0; }
.v16-ed-body .md-h{ font-size:19px; font-weight:800; margin:18px 0 8px; }
.v16-ed-body .md-quote{ border-left:3px solid var(--vp-accent); background:var(--vp-paper-2);
  padding:8px 14px; border-radius:0 10px 10px 0; margin:12px 0; color:var(--vp-ink-2); }
.v16-ed-body .md-quote p{ margin:4px 0; }
.v16-ed-body .md-pre{ background:var(--vp-paper-2); border-radius:12px; padding:14px;
  overflow-x:auto; margin:12px 0; }
.v16-ed-body .md-pre code{ font-family:ui-monospace,monospace; font-size:13px; color:var(--vp-ink); }
.v16-ed-body .md-code{ background:var(--vp-paper-2); padding:1px 6px; border-radius:6px;
  font-family:ui-monospace,monospace; font-size:13.5px; }
.v16-ed-body .md-hl{ background:var(--vp-accent-soft); padding:0 3px; border-radius:3px; }
.v16-ed-body .md-hr{ border:none; border-top:1px solid var(--vp-line); margin:16px 0; }
.v16-ed-body ul, .v16-ed-body ol{ margin:10px 0; padding-left:6px; list-style:none; }
.v16-ed-body ul li::before{ content:'·'; margin-right:8px; color:var(--vp-accent); font-weight:800; }
.v16-ed-body ol{ counter-reset:it; }
.v16-ed-body ol li{ counter-increment:it; }
.v16-ed-body ol li::before{ content:counter(it)'.'; margin-right:8px; color:var(--vp-accent); font-weight:700; }
.v16-ed-body .md-tag{ color:var(--vp-accent); font-weight:600; }
.v16-ed-body .md-wiki{ color:var(--vp-accent); background:var(--vp-accent-soft); padding:0 4px; border-radius:5px; }
.v16-ed-body .md-link{ color:var(--vp-accent); }
.v16-ed-body .md-img{ width:100%; border-radius:12px; margin:10px 0; display:block; box-shadow:var(--vp-shadow); }

/* 待办行（可勾选） */
.v16-todo{ display:flex; align-items:flex-start; gap:10px; padding:8px 4px; cursor:pointer;
  border-radius:10px; }
.v16-todo:active{ background:var(--vp-paper-2); }
.v16-todo .mbox{ width:22px; height:22px; border-radius:7px; border:2px solid var(--vp-ink-3);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px;
  transition:background var(--dur-2) var(--ease-spring), border-color var(--dur-2); }
.v16-todo .mbox svg{ width:13px; height:13px; color:#fff; opacity:0; transition:opacity .1s; }
.v16-todo.done .mbox{ background:var(--vp-accent); border-color:var(--vp-accent); }
.v16-todo.done .mbox svg{ opacity:1; }
.v16-todo .mtxt{ flex:1; font-size:15px; line-height:1.5; }
.v16-todo.done .mtxt{ color:var(--vp-ink-3); text-decoration:line-through; }
.v16-todo.pr-high .mbox{ border-color:var(--vp-accent); }
.v16-todo .badge{ font-size:10.5px; padding:1px 7px; border-radius:8px; font-weight:700; flex-shrink:0; }
.v16-todo.pr-high .badge{ background:var(--vp-c-pink); color:#A04438; }
.v16-todo.pr-low .badge{ background:var(--vp-c-blue); color:#3A5A80; }

/* 源码模式 */
.v16-source{ width:100%; min-height:60vh; font-family:ui-monospace,monospace; font-size:13.5px;
  line-height:1.7; color:var(--vp-ink); background:var(--vp-paper-2); border-radius:14px;
  padding:16px; resize:none; white-space:pre-wrap; }

/* 附件区 */
.v16-attach-sec{ margin-top:18px; }
.v16-attach-sec .ast{ font-size:12.5px; color:var(--vp-ink-3); font-weight:700; margin-bottom:8px; }
.v16-attach-row{ display:flex; gap:10px; flex-wrap:wrap; }
.v16-att{ width:84px; cursor:pointer; }
.v16-att img{ width:84px; height:64px; object-fit:cover; border-radius:10px; box-shadow:var(--vp-shadow); }
.v16-att .an{ font-size:11px; color:var(--vp-ink-3); margin-top:4px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.v16-att .fileico{ width:84px; height:64px; border-radius:10px; background:var(--vp-paper-2);
  display:flex; align-items:center; justify-content:center; color:var(--vp-ink-2); }
.v16-att .fileico svg{ width:30px; height:30px; }

/* 底部工具栏 */
.v16-dock{ flex-shrink:0; display:flex; align-items:center; gap:2px; padding:8px 8px calc(8px + var(--safe-b,0px));
  border-top:1px solid var(--vp-line); background:var(--vp-paper); overflow-x:auto; scrollbar-width:none; }
.v16-dock::-webkit-scrollbar{ display:none; }
.v16-dock button{ min-width:40px; height:40px; border-radius:10px; display:flex; align-items:center;
  justify-content:center; color:var(--vp-ink-2); padding:0 8px; }
.v16-dock button:active{ background:var(--vp-accent-soft); color:var(--vp-accent); }
.v16-dock button svg{ width:20px; height:20px; }

/* ---------- 设置 ---------- */
.v16-settings-scroll{ flex:1; overflow-y:auto; padding:6px 16px calc(40px + var(--safe-b,0px)); }
.v16-set-group{ background:var(--vp-card); border-radius:var(--vp-r); margin-bottom:14px;
  box-shadow:var(--vp-shadow); overflow:hidden; }
.v16-set-head{ display:flex; align-items:center; gap:10px; padding:15px 16px; cursor:pointer; }
.v16-set-head .stic{ width:22px; height:22px; color:var(--vp-accent); flex-shrink:0; }
.v16-set-head .st{ font-size:15px; font-weight:800; flex:1; }
.v16-set-head .stw{ width:18px; height:18px; color:var(--vp-ink-3); transition:transform var(--dur-2) var(--ease-decel); }
.v16-set-group.open .stw{ transform:rotate(180deg); }
.v16-set-body{ overflow:hidden; max-height:0; transition:max-height var(--dur-3) var(--ease-decel); }
.v16-set-group.open .v16-set-body{ max-height:800px; }
.v16-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-top:1px solid var(--vp-line);
  font-size:14px; }
.v16-row .rl{ flex:1; }
.v16-row .rv{ color:var(--vp-ink-3); font-size:12.5px; text-align:right; max-width:50%; }
.v16-row:active{ background:var(--vp-paper-2); }
.v16-row .rgo{ width:16px; height:16px; color:var(--vp-ink-3); }
.v16-row.hl{ background:var(--vp-c-yellow); }
.v16-switch{ width:44px; height:26px; border-radius:14px; background:var(--vp-line); position:relative; flex-shrink:0;
  transition:background var(--dur-2); }
.v16-switch::after{ content:''; position:absolute; top:3px; left:3px; width:20px; height:20px;
  border-radius:50%; background:#fff; transition:transform var(--dur-2) var(--ease-spring);
  box-shadow:0 1px 3px rgba(0,0,0,.25); }
.v16-switch.on{ background:var(--vp-accent); }
.v16-switch.on::after{ transform:translateX(18px); }

/* ---------- 搜索页 ---------- */
.v16-search-field{ margin:0 16px 10px; display:flex; align-items:center; gap:10px;
  background:var(--vp-card); border-radius:14px; padding:0 14px; height:44px; box-shadow:var(--vp-shadow); }
.v16-search-field svg{ width:18px; height:18px; color:var(--vp-ink-3); flex-shrink:0; }
.v16-search-field input{ flex:1; font-size:15px; }
.v16-search-scroll{ flex:1; overflow-y:auto; padding:0 16px calc(40px + var(--safe-b,0px)); }
.v16-sr-hit{ background:var(--vp-card); border-radius:var(--vp-r-sm); padding:13px 14px; margin-bottom:10px;
  box-shadow:var(--vp-shadow); cursor:pointer; }
.v16-sr-hit .ht{ font-size:14.5px; font-weight:700; }
.v16-sr-hit .hs{ font-size:12.5px; color:var(--vp-ink-2); margin-top:4px; line-height:1.5; }
.v16-sr-hit mark{ background:var(--vp-accent-soft); color:var(--vp-accent); padding:0 2px; border-radius:3px; }

/* ---------- 回收站 ---------- */
.v16-trash-scroll{ flex:1; overflow-y:auto; padding:6px 16px calc(40px + var(--safe-b,0px)); }
.v16-trash-item{ background:var(--vp-card); border-radius:var(--vp-r-sm); padding:13px 14px; margin-bottom:10px;
  box-shadow:var(--vp-shadow); display:flex; align-items:center; gap:10px; }
.v16-trash-item .ti{ flex:1; }
.v16-trash-item .tn{ font-size:14.5px; font-weight:700; }
.v16-trash-item .tp{ font-size:12px; color:var(--vp-ink-3); margin-top:3px; }
.v16-trash-item button{ font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:9px; }
.v16-trash-item .b-restore{ background:var(--vp-accent-soft); color:var(--vp-accent); }
.v16-trash-item .b-del{ color:var(--vp-ink-3); }

/* ---------- 底部 sheet ---------- */
.v16-sheet-mask{ position:absolute; inset:0; z-index:20; background:rgba(40,36,28,.34);
  opacity:0; visibility:hidden; transition:opacity var(--dur-3) ease, visibility var(--dur-3); }
.v16-sheet-mask.open{ opacity:1; visibility:visible; }
.v16-sheet{ position:absolute; left:0; right:0; bottom:0; z-index:21; background:var(--vp-card);
  border-radius:22px 22px 0 0; padding:8px 0 calc(6px + var(--safe-b,0px));
  transform:translateY(105%); transition:transform var(--dur-4) var(--ease-decel); }
.v16-sheet.open{ transform:none; }
.v16-sheet-grip{ width:38px; height:4px; border-radius:2px; background:var(--vp-line); margin:6px auto 10px; }
.v16-sheet-title{ font-size:13px; color:var(--vp-ink-3); text-align:center; margin-bottom:8px; font-weight:700; }
.v16-sheet-opt{ display:flex; align-items:center; gap:12px; padding:14px 20px; font-size:15px; cursor:pointer; }
.v16-sheet-opt:active{ background:var(--vp-paper-2); }
.v16-sheet-opt svg{ width:20px; height:20px; color:var(--vp-ink-2); }
.v16-sheet-cancel{ margin:8px 14px 0; padding:14px; text-align:center; font-size:15px; font-weight:700;
  border-radius:14px; background:var(--vp-paper-2); color:var(--vp-ink); }

/* ---------- toast ---------- */
.v16-toast{ position:absolute; left:50%; bottom:calc(110px + var(--safe-b,0px)); transform:translateX(-50%);
  background:rgba(50,46,38,.92); color:#fff; padding:10px 18px; border-radius:20px; font-size:13.5px;
  z-index:40; opacity:0; visibility:hidden; transition:opacity var(--dur-2) ease, transform var(--dur-2) ease;
  max-width:80%; text-align:center; }
.v16-toast.show{ opacity:1; visibility:visible; transform:translateX(-50%) translateY(-6px); }

/* ---------- 主题圆形扩散（双图层） ---------- */
.v16-reveal{ position:fixed; inset:0; z-index:70; pointer-events:none; border-radius:50%;
  transform:scale(0); opacity:0; }

/* ---------- 大图查看器 ---------- */
.v16-imgviewer{ position:fixed; inset:0; z-index:80; background:rgba(10,10,10,.94);
  display:flex; align-items:center; justify-content:center; opacity:0; visibility:hidden;
  transition:opacity var(--dur-3) ease, visibility var(--dur-3); }
.v16-imgviewer.open{ opacity:1; visibility:visible; }
.v16-imgviewer img{ max-width:94%; max-height:88%; border-radius:6px; }
.v16-imgviewer .close{ position:absolute; top:16px; right:16px; color:#fff;
  width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.v16-imgviewer .close svg{ width:26px; height:26px; }

/* 多选底部操作条 */
.v16-selbar{ position:absolute; left:0; right:0; bottom:0; z-index:9;
  background:var(--vp-card); display:flex; padding:10px calc(12px + var(--safe-b,0px)) calc(10px + var(--safe-b,0px));
  box-shadow:0 -4px 20px rgba(0,0,0,.1); transform:translateY(110%); transition:transform var(--dur-3) var(--ease-spring-soft); }
.v16-selbar.open{ transform:none; }
.v16-selbar button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:11.5px; color:var(--vp-ink-2); padding:6px 0; }
.v16-selbar button svg{ width:22px; height:22px; }
.v16-selbar button:active{ color:var(--vp-accent); }

/* ============================================================
   M1：旧 v15 screen 整体压在新 UI 之下、不拦截指针与转场
   （旧模块保留在磁盘与 git，M2-M4 逐步迁移；走查期新 UI 独占前台）
   ============================================================ */
#app > .screen{ visibility:hidden !important; opacity:0 !important;
  pointer-events:none !important; z-index:0 !important; transform:none !important; }
#app > .mask, #app > .sheet, #app > .modal, #app > .sync-overlay,
#app > .toast, #app > .nb-picker, #app > .chat-drawer, #app > .note-ai-panel{ z-index:1 !important; }

</style>
</head>
<body>
<div class="phone">
  <div class="app" id="app">

    <!-- ===== 视图：首页 ===== -->
    <section class="screen root active" id="scr-home">
      <header class="topbar" id="homeTopbar">
        <button class="icon-btn ai-entry" id="openChat" aria-label="AI 对话">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l1.9 5.1 5.1 1.9-5.1 1.9L12 16.6l-1.9-5.1L5 9.6l5.1-1.9z"/><path d="M18.6 15l.85 2.35L21.8 18.2l-2.35.85L18.6 21.4l-.85-2.35L15.4 18.2l2.35-.85z" opacity=".65"/></svg>
        </button>
        <div class="search-entry">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="homeSearch" placeholder="搜索" autocomplete="off" readonly>
          <button class="mini-clear" id="miniClear" hidden aria-label="清空">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="openSettings" aria-label="设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="cancel-link" id="searchCancel">取消</button>
      </header>
      <header class="context-bar" id="contextBar">
        <button class="icon-btn" id="exitSelect" aria-label="退出多选">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
        <span class="count" id="selCount">已选 0 项</span>
        <button class="icon-btn" id="selectAll" aria-label="全选">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
        </button>
      </header>
      <div class="chips-row" id="chipsRow"></div>
      <div class="screen-body">
        <div class="notes-wrap" id="notesWrap"></div>
      </div>
      <div class="batch-bar" id="batchBar">
        <button class="bb-btn" id="bbMove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.3 3.6A2 2 0 0 0 7.6 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/></svg>移动</button>
        <button class="bb-btn" id="bbPin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6l-1 7 3 3H7l3-3z"/><path d="M12 13v8"/></svg>置顶</button>
        <button class="bb-btn" id="bbColor"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c.9 0 1.6-.7 1.6-1.6 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.1 0-.9.7-1.6 1.6-1.6H16a5 5 0 0 0 5-5c0-3.9-4-7.5-9-7.5z"/><circle cx="7.5" cy="10.5" r="1.1" fill="currentColor"/><circle cx="12" cy="7.5" r="1.1" fill="currentColor"/><circle cx="16.5" cy="10.5" r="1.1" fill="currentColor"/></svg>颜色</button>
        <button class="bb-btn" id="bbDelete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M10 11v6M14 11v6"/></svg>删除</button>
      </div>
      <button class="fab" id="fab" aria-label="新建">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </section>

    <!-- ===== 视图：编辑 ===== -->
    <section class="screen" id="scr-edit">
      <header class="edit-top" id="editTop">
        <div class="et-group et-left">
        <button class="icon-btn" id="editBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        </div>
        <div class="et-group et-center">
        <button class="icon-btn disabled" id="editUndo" aria-label="撤销">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="icon-btn disabled" id="editRedo" aria-label="重做">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
        </button>
        </div>
        <div class="et-group et-right">
        <button class="icon-btn note-ai-btn" id="editNoteAI" aria-label="本页智能问答">AI</button>
        <button class="icon-btn" id="editShare" aria-label="分享">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
        </button>
        <button class="icon-btn" id="editMore" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg>
        </button>
        </div>
      </header>
      <div class="paper-scroll" id="paperScroll">
        <div class="paper-meta" id="paperMeta"></div>
        <input class="paper-title" id="paperTitle" placeholder="标题" maxlength="40">
        <div class="paper-rtbar" id="paperRtBar"></div>
        <div class="paper-todo" id="paperTodo"></div>
        <div class="paper-body" id="paperBody" contenteditable="true" spellcheck="false"></div>
        <div class="paper-attach" id="paperAttach"></div>
      </div>
      <div class="dock" id="dock">
        <button class="dock-btn" id="dockAI" aria-label="格式笔">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="dock-btn" id="dockTodo" aria-label="待办">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.6 2.6L16 9"/></svg>
        </button>
        <button class="dock-btn" id="dockAdd" aria-label="插入">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 8.2v7.6M8.2 12h7.6"/></svg>
        </button>
      </div>
      <div id="deskEditEmpty">
        <svg class="de-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6M9 17h4"/></svg>
        <p>从左侧选择一条便签查看与编辑，<br>或点击按钮新建一张便签。</p>
        <button class="desk-empty-new" id="deskEmptyNew">+ 新建便签</button>
      </div>
    </section>
    <!-- ===== 视图：回收站 ===== -->
    <section class="screen" id="scr-trash">
      <header class="topbar">
        <button class="icon-btn" id="trashBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>回收站</h1>
        <button class="cancel-link" style="display:block" id="trashEmpty">清空</button>
      </header>
      <div class="screen-body"><div class="trash-list" id="trashList"></div></div>
    </section>

    <!-- ===== 视图：设置 ===== -->
    <section class="screen" id="scr-settings">
      <header class="topbar">
        <button class="icon-btn" id="settingsBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>设置</h1>
      </header>
      <div class="screen-body"><div class="settings" id="settingsBody"></div></div>
    </section>

    <!-- ===== 视图：百度网盘 ===== -->
    <section class="screen" id="scr-pan">
      <header class="topbar">
        <button class="icon-btn" id="panBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>百度网盘</h1>
      </header>
      <div class="screen-body"><div class="pan-settings" id="panBody"></div></div>
    </section>

    <!-- ===== 统一搜索（搜索 / 知识库 RAG / 问 AI） ===== -->
    <section class="screen" id="scr-search">
      <header class="topbar">
        <button class="icon-btn" id="srBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="sr-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="srInput" placeholder="搜索" autocomplete="off" enterkeyhint="search">
          <button class="mini-clear" id="srClear" hidden aria-label="清空">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
      </header>
      <div class="seg" id="srSeg">
        <button data-m="search" class="on">搜索</button>
        <button data-m="rag">知识库</button>
      </div>
      <div class="screen-body">
        <div class="sr-body" id="srBody"></div>
      </div>
    </section>

    <!-- ===== AI 对话（独立模块） ===== -->
    <section class="screen" id="scr-chat">
      <header class="topbar chat-top">
        <button class="icon-btn desk-only" id="chatDeskBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button class="icon-btn" id="chatMenu" aria-label="历史对话">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <h1 class="chat-title" id="chatTitle">AI 对话</h1>
        <button class="icon-btn" id="chatNewTop" aria-label="新对话">

        </button>
      </header>

      <div class="screen-body chat-body" id="chatBody"></div>
      <div class="chat-input-bar">
        <div class="chat-input-wrap"><textarea id="chatInput" rows="1" placeholder="请输入问题"></textarea></div>
        <button class="chat-send" id="chatSend" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </div>
    </section>
    <!-- 历史对话侧边抽屉 -->
    <div class="chat-drawer-mask" id="chatDrawerMask"></div>
    <aside class="chat-drawer" id="chatDrawer">
      <div class="cd-head"><span class="cd-head-sp"></span><b>历史对话</b>
        <button class="icon-btn" id="cdClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="cd-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="cdSearch" placeholder="搜索对话" autocomplete="off">
      </div>
      <div class="cd-list" id="cdList"></div>
    </aside>

    <!-- 本页笔记智能问答 -->
    <div class="note-ai-mask" id="noteAiMask"></div>
    <section class="note-ai-panel" id="noteAiPanel">
      <header class="topbar">
        <button class="icon-btn" id="naiBack" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>本页问答</h1>
      </header>
      <div class="scope-bar" id="naiScopeBar"></div>
      <div class="screen-body chat-body" id="naiBody"></div>
      <div class="chat-input-bar">
        <div class="chat-input-wrap"><textarea id="naiInput" rows="1" placeholder="针对这页笔记提问…"></textarea></div>
        <button class="chat-send" id="naiSend" aria-label="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
        </button>
      </div>
    </section>

    <!-- ===== API 配置（ccswitch 风格） ===== -->
    <section class="screen" id="scr-ai">
      <header class="topbar">
        <button class="icon-btn" id="aiListBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>API 配置</h1>
      </header>
      <div class="screen-body">
        <div class="ai-list" id="aiList"></div>
        <button class="pan-save" id="aiAdd">新增配置</button>
      </div>
    </section>

    <!-- ===== 运行日志 ===== -->
    <section class="screen" id="scr-log">
      <header class="topbar">
        <button class="icon-btn" id="logBack" aria-label="返回">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <h1>运行日志</h1>
        <button class="icon-btn" id="logExport" aria-label="导出日志">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        </button>
      </header>
      <div class="log-filter" id="logFilter">
        <button data-lv="all" class="on">全部</button>
        <button data-lv="error">错误</button>
        <button data-lv="warn">警告</button>
        <button data-lv="info">信息</button>
        <button id="logClear" class="lc">清空</button>
      </div>
      <div class="screen-body"><div class="log-list" id="logList"></div></div>
    </section>

    <!-- ===== 浮层 ===== -->
    <div class="mask" id="mask"></div>
    <div class="sheet" id="dynSheet">
      <div class="sheet-grip"></div>
      <div class="sheet-title" id="dynTitle">请选择</div>
      <div id="dynOpts"></div>
      <button class="sheet-cancel" id="dynCancel">取消</button>
    </div>
    <div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
    <div class="toast" id="toast"></div>
    <div id="syncTopBar"><i></i></div>

/* FLIP：记录一组元素位置 → 执行变更 → 在下一帧用 transform 平滑补位
   只动 transform/opacity；返回选择器内全部元素。opts:duration/ease/stagger */
function flipPositions(els, mutate, opts){
  opts=opts||{};
  const list=els.filter(Boolean);
  const before=new Map(list.map(el=>[el, el.getBoundingClientRect()]));
  const ret=mutate();
  if(reduceMotion()) return ret;
  const dur=opts.duration||'var(--dur-3)', ease=opts.ease||'var(--ease-spring-soft)';
  requestAnimationFrame(()=>{
    list.forEach((el,i)=>{
      const b=before.get(el); if(!b)return;
      const a=el.getBoundingClientRect();
      const dx=b.left-a.left, dy=b.top-a.top;
      if(!dx&&!dy)return;
      const st=el.style;
      st.transition='none'; st.transform='translate('+dx+'px,'+dy+'px)';
      const delay=opts.stagger?(';transition-delay:'+(i*opts.stagger)+'ms'):'';
      void el.offsetWidth;
      st.transition='transform '+dur+' '+ease+delay;
      st.transform='';
      const clear=()=>{st.transition='';st.transitionDelay='';st.transform='';el.removeEventListener('transitionend',clear);};
      el.addEventListener('transitionend',clear);
      setTimeout(clear, opts.timeout||600);
    });
  });

}
/* 数字滚动（odometer）：把文本节点的旧数字滚动到新值；非数字部分不动 */
function animateNumber(el, newVal, opts){
  opts=opts||{};
  const decimals=(String(newVal).split('.')[1]||'').length;
  const from=parseFloat((el.textContent||'').replace(/[^\d.]/g,''))||0;
  const to=parseFloat(newVal);
  if(reduceMotion()||from===to||isNaN(to)){ el.textContent=opts.format?opts.format(to):to; return; }
  const t0=performance.now(), dur=opts.duration||240;
  const prefix=opts.prefix||'', suffix=opts.suffix||'';
  function tick(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    const v=from+(to-from)*e;
    el.textContent=prefix+(decimals?v.toFixed(decimals):Math.round(v))+suffix;
    if(p<1)requestAnimationFrame(tick);
    else el.textContent=prefix+(decimals?to.toFixed(decimals):to)+suffix;
  }
  requestAnimationFrame(tick);
}

function fileKind(name){

  if(['xlsx','xls','csv','numbers'].includes(e))return 'excel';
  if(['docx','doc','pages','rtf'].includes(e))return 'word';
  if(e==='pdf')return 'pdf';
  if(['jpg','jpeg','png','gif','webp','svg','heic'].includes(e))return 'image';
  if(['mp3','wav','m4a','aac','flac','ogg'].includes(e))return 'audio';
  if(['mp4','mov','avi','mkv','webm'].includes(e))return 'video';
  if(['zip','rar','7z','tar','gz'].includes(e))return 'zip';
  return 'file';
}

const idbDelBlob=k=>idbAwait(idbStore('blobs','readwrite').delete(k));
function dataURLtoBlob(dataurl){
  const parts=dataurl.split(','),m=/data:(.*?);base64/.exec(parts[0]||'');
  const bin=atob(parts[1]||''),len=bin.length,arr=new Uint8Array(len);
  for(let i=0;i<len;i++)arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:m?m[1]:'application/octet-stream'});}

/* ---- Store：统一持久层 ---- */
const Store={
  env:'idb',db:null,
  async init(){
    this.env=hasNative()?'native':(window.indexedDB?'idb':'legacy');
    if(this.env==='idb'){
      await new Promise((res,rej)=>{
        const rq=indexedDB.open(DB_NAME,1);
        rq.onupgradeneeded=e=>{const db=e.target.result;
          if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');
          if(!db.objectStoreNames.contains('blobs'))db.createObjectStore('blobs');};
        rq.onsuccess=e=>{this.db=e.target.result;res();};rq.onerror=()=>rej(rq.error);});
    }
    await this.bootData();
  },
  payload(){
    /* 新建后从未改动的便签（_pristine）不落盘；同时剔除临时字段 */
    const kept=notes.filter(n=>!n._pristine)
      .map(n=>{const c=Object.assign({},n);delete c._pristine;return c;});
    return JSON.stringify({app:'zhipian-notes',version:3,savedAt:new Date().toISOString(),notes:kept,prefs,cloudDeleted});
  },
  async saveMeta(){
    const p=this.payload();
    if(this.env==='native')await Native.call('saveMeta',p);
    else if(this.env==='idb')await idbPut('library',p);
    else localStorage.setItem(KLIB_V3,p);
  },
  async addBlob(id,blob){
    if(this.env==='native'){
      const dataUrl=await readAsDataURL(blob);
      await Native.call('putBlobFromDataUrl',JSON.stringify(
        {id,dataUrl,name:blob.name||'',type:blob.type||'application/octet-stream'}));
    }
    else if(this.env==='idb')await idbPutBlob(id,blob);
    else if(this.env==='legacy'){/* 无 blob 能力，忽略 */}
  },
  async blobURL(f){
    if(this.env==='idb'){const b=await idbGetBlob(f.id);return URL.createObjectURL(b);}
    return null;
  },
  async removeBlob(f){
    if(this.env==='native')await Native.call('deleteFile',JSON.stringify({id:f.id}));
    else if(this.env==='idb')await idbDelBlob(f.id);
  },
  async bootData(){
    let lib=null;
    if(this.env==='native')lib=await Native.call('loadMeta').catch(()=>null);
    else if(this.env==='idb')lib=await idbGet('library');
    else lib=localStorage.getItem(KLIB_V3);
    if(typeof lib==='string'){try{lib=JSON.parse(lib);}catch(e){lib=null;}}
    if(lib&&Array.isArray(lib.notes)){notes=lib.notes;prefs=Object.assign(prefs,lib.prefs||{});
      cloudDeleted=Array.isArray(lib.cloudDeleted)?lib.cloudDeleted:[];migrate();return;}
    if(await this.migrateLegacy()){migrate();return;}
    notes=seed();await this.seedBlobs();migrate();
  },
  async absorbFiles(list){
    for(const n of list){
      for(const f of(n.files||[])){
        if(f.data){
          if(this.env==='native')
            await Native.call('putBlobFromDataUrl',JSON.stringify({id:f.id,dataUrl:f.data,name:f.name,type:f.type}));
          else if(this.env==='idb')await idbPutBlob(f.id,dataURLtoBlob(f.data));
          delete f.data;
        }
      }
    }
  },
  async migrateLegacy(){
    const raw=localStorage.getItem(KNOTES_V2)||localStorage.getItem(KNOTES_V1);
    if(!raw)return false;
    let old;try{old=JSON.parse(raw);}catch(e){return false;}
    if(!Array.isArray(old))return false;
    notes=old;
    try{const p=localStorage.getItem(KPREF_V2);if(p)prefs=Object.assign(prefs,JSON.parse(p));}catch(e){}
    await this.absorbFiles(notes);
    return true;
  },
  async seedBlobs(){await this.absorbFiles(notes);}
};

}

    .then(()=>{ if(Store.env==='native')return Native.call('forceMirror').catch(()=>{}); })
    .catch(e=>console.warn('flush failed',e));
}

function migrate(){
  let changed=false;const now=Date.now();
  notes.forEach(n=>{
    if(typeof n!=='object'||n===null)return;
    if(!n.id){n.id=uid();changed=true;}
    if(n.type!=='note'&&n.type!=='todo'){n.type='note';changed=true;}
    if(n.title==null){n.title='';changed=true;}
    if(n.content==null){n.content='';changed=true;}
    if('tags' in n){delete n.tags;changed=true;}
    if(!Array.isArray(n.files)){n.files=[];changed=true;}
    if(!Array.isArray(n.todos)){n.todos=[];changed=true;}
    if(n.pinned==null){n.pinned=false;changed=true;}
    if(n.trashed==null){n.trashed=false;changed=true;}
    if(n.trashedAt==null){n.trashedAt=null;changed=true;}
    if(n.color==null||n.color===''){n.color=n.type==='todo'?'green':'yellow';changed=true;}
    if(n.createdAt==null){n.createdAt=now;changed=true;}
    if(n.updatedAt==null){n.updatedAt=n.createdAt;changed=true;}
    n.todos.forEach(t=>{
      if(typeof t!=='object'||t===null)return;
      if(!t.id){t.id=uid();changed=true;}
      if(t.text==null){t.text='';changed=true;}
      if(t.done==null){t.done=false;changed=true;}
      if(!['high','normal','low'].includes(t.priority)){t.priority='normal';changed=true;}
    });
    n.files.forEach((f,fi)=>{
      if(typeof f!=='object'||f===null)return;
      if(!f.id){f.id=uid();changed=true;}
      if(f.name==null){f.name='文件';changed=true;}
      if(f.size==null){f.size=0;changed=true;}
      if(!f.kind){f.kind=fileKind(f.name);changed=true;}
      if(f.type==null){f.type='';changed=true;}
      if(f.idx==null){f.idx=fi+1;changed=true;}
    });
  });
  const b=notes.length;
  notes=notes.filter(n=>n&&n.id&&!(n.trashed&&n.trashedAt&&now-n.trashedAt>7*864e5));
  if(notes.length!==b)changed=true;
  /* 清理历史遗留空便签（无标题/正文/附件/待办文本，含回收站里的） */
  const a2=notes.length;
  notes=notes.filter(n=>!isEmptyNote(n));
  if(notes.length!==a2)changed=true;
  /* 标签功能已移除：直接清掉偏好上的标签字段，不保留旧数据兼容逻辑 */
  ['favoriteTags','extraTags','tagSug','tagBlock'].forEach(k=>{if(k in prefs){delete prefs[k];changed=true;}});
  if(changed)persist();
}

function applyTheme(){
  let t=prefs.theme||'auto';
  if(t==='auto'&&window.matchMedia)
    t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=t;

/* #14 主题切换圆形扩散（真实"扫到哪变到哪"）：
   克隆当前屏幕作为"新主题预览层"，用 clip-path 圆形从触点揭开——
   圈内已经是新主题的真实界面，圈外仍是旧主题；圆形铺满后切换真实主题并移除克隆。
   生命周期由计时器权威驱动，任何 WebView 动画回调丢失都不会残留。 */
let _themeRevealToken=0;
function themeSwitchTo(t,x,y){
  if((prefs.theme||'light')===t)return;
  const eff=t==='auto'
    ?(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')
    :t;
  const cur=document.documentElement.dataset.theme||'light';
  const apply=()=>{
    prefs.theme=t;persistPrefs();applyTheme();
    if($('#settingsBody'))patchSettingsTheme(t);else renderSettings();
    /* 防止个别 WebView 在按钮重建/失焦后把焦点落到返回键，造成“点亮”假象 */
    const ae=document.activeElement;
    if(ae&&ae.id&&ae.id.endsWith('Back')){try{ae.blur();}catch(_){}}
  };
  const unlock=()=>document.body.classList.remove('theme-reveal-on');
  if(eff===cur){apply();return;}
  if(reduceMotion()||!Element.prototype.animate){apply();return;}
  /* 单实例：快速连点清掉旧层；旧实例定时器用 token 失效化 */
  document.querySelectorAll('.trl').forEach(o=>o.remove());
  const my=++_themeRevealToken;
  const fresh=()=>my===_themeRevealToken;
  /* 扩散期间锁定顶栏真实按钮（返回键不会被任何残影/补发事件点亮或误点）；
     克隆层 pointer-events:none，视觉不受影响，结束后立即恢复 */
  document.body.classList.add('theme-reveal-on');
  const screen=document.querySelector('.screen.active');
  const host=document.querySelector('.phone')||screen;
  const rect=host.getBoundingClientRect();
  /* 克隆当前屏幕（含滚动位置）作为新主题层 */
  const layer=document.createElement('div');
  layer.className='trl';
  layer.dataset.theme=eff;
  layer.style.left=rect.left+'px';
  layer.style.top=rect.top+'px';
  layer.style.width=rect.width+'px';
  layer.style.height=rect.height+'px';
  const clone=screen.cloneNode(true);
  clone.classList.add('trl-screen');
  const ob=screen.querySelector('.screen-body'),cb=clone.querySelector('.screen-body');
  if(ob&&cb){cb.scrollTop=ob.scrollTop;cb.scrollLeft=ob.scrollLeft;}
  /* 克隆里的主题段直接显示目标选中态，避免切换瞬间按钮高光错位 */
  const seg=clone.querySelector('#themeSeg');
  if(seg)seg.querySelectorAll('button').forEach(btn=>btn.classList.toggle('on',btn.dataset.t===t));
  layer.appendChild(clone);
  document.body.appendChild(layer);
  haptic(10);
  /* 圆的圆心/半径按层自身坐标计算 */
  const cx=Math.min(rect.width,Math.max(0,x-rect.left));
  const cy=Math.min(rect.height,Math.max(0,y-rect.top));
  const maxR=Math.hypot(Math.max(cx,rect.width-cx),Math.max(cy,rect.height-cy));
  layer.style.clipPath='circle(0px at '+cx+'px '+cy+'px)';
  const DUR=480;
  try{
    layer.animate(
      [{clipPath:'circle(0px at '+cx+'px '+cy+'px)'},
       {clipPath:'circle('+(maxR*1.02)+'px at '+cx+'px '+cy+'px)'}],
      {duration:DUR,easing:'cubic-bezier(.28,.72,.22,1)',fill:'forwards'});
  }catch(_){layer.remove();unlock();apply();return;}
  /* 圆形铺满瞬间切换真实主题（此时全屏已被新主题克隆遮住，切换无感） */
  setTimeout(()=>{
    if(!fresh())return;
    apply();
    /* 两帧后克隆与真实界面一致，直接移除；真实界面是淡入 100ms 兜底错位 */
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      if(fresh()){layer.style.transition='opacity .1s ease-out';layer.style.opacity='0';
        setTimeout(()=>{if(layer.parentNode)layer.remove();unlock();},130);}
    }));
  },DUR-10);
  /* 硬兜底：无论如何 900ms 后移除并解锁，杜绝残留 */
  setTimeout(()=>{if(fresh()){try{apply();}catch(_){}if(layer.parentNode)layer.remove();unlock();}},900);
  /* 切后台立即清掉 */
  const onVis=()=>{if(document.hidden){layer.remove();unlock();document.removeEventListener('visibilitychange',onVis);}};
  document.addEventListener('visibilitychange',onVis);
}

function applyFontScale(){document.documentElement.style.zoom=(prefs.fontScale&&prefs.fontScale!==1)?prefs.fontScale:'';}
/* #9 横向字号刻度尺：两侧渐隐、居中高亮、拖动实时预览、松手吸附最近刻度 */
function buildFontRuler(ruler,numEl,setScale){
  const SCALE_MIN=.85,SCALE_MAX=1.30,STEP=5,SPACE=46;
  const vals=[];
  for(let v=SCALE_MIN*100;v<=SCALE_MAX*100+0.001;v+=STEP)vals.push(Math.round(v));
  const cursor=document.createElement('div');cursor.className='fs-cursor';
  ruler.appendChild(cursor);
  const track=document.createElement('div');track.className='fs-track';
  ruler.appendChild(track);
  vals.forEach((v,i)=>{
    const major=v%10===0;
    const t=document.createElement('div');
    t.className='fs-tick '+(major?'major':'minor');
    t.innerHTML='<i></i><span class="fs-tk-num">'+(major?v:'')+'</span>';
    t.dataset.i=i;
    track.appendChild(t);
  });
  const scaleToIdx=s=>(s*100-SCALE_MIN*100)/STEP;
  const idxToScale=i=>SCALE_MIN+i*STEP/100;
  let idx=scaleToIdx(prefs.fontScale||1),dragStartX=0,dragStartIdx=0,dragging=false;
  const paint=()=>{
    const near=Math.round(idx);
    track.querySelectorAll('.fs-tick').forEach((t,i)=>{
      const off=i-idx;
      t.style.left='calc(50% + '+(off*SPACE).toFixed(1)+'px)';
      t.style.opacity=Math.max(0,Math.min(1,1-Math.abs(off)/6)).toFixed(2);
      t.classList.toggle('on',i===near);
    });
    if(numEl)numEl.textContent=Math.round((SCALE_MIN+near*STEP/100)*100);
  };
  const snap=()=>{
    const i=Math.max(0,Math.min(vals.length-1,Math.round(idx)));
    idx=i;
    if(!reduceMotion()){
      const start=performance.now();
      const from=track._animIdx===undefined?i:track._animIdx;
      const ease=t=>1-Math.pow(1-t,3);
      const to=i;
      const run=t=>{
        const p=Math.min(1,(t-start)/220);
        idx=from+(to-from)*ease(p);
        paint();
        if(p<1)requestAnimationFrame(run);
      };
      requestAnimationFrame(run);
    }else paint();
    setScale(idxToScale(i),false);
    haptic(12);
  };
  ruler.addEventListener('pointerdown',e=>{
    dragging=true;dragStartX=e.clientX;dragStartIdx=idx;
    ruler.classList.add('dragging');
    try{ruler.setPointerCapture(e.pointerId);}catch(_){}
  });
  ruler.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const raw=dragStartIdx-(e.clientX-dragStartX)/SPACE;
    idx=Math.max(0,Math.min(vals.length-1,raw));
    track._animIdx=idx;
    paint();
    setScale(idxToScale(idx),true);
  });
  const end=()=>{if(!dragging)return;dragging=false;ruler.classList.remove('dragging');snap();};
  ruler.addEventListener('pointerup',end);
  ruler.addEventListener('pointercancel',end);
  paint();
  return {
    setIndex(i){idx=Math.max(0,Math.min(vals.length-1,i));track._animIdx=idx;paint();},
    scaleToIdx
  };
}

let editingId=null;let editReturnHash='';
function parseHash(){
  const h=(location.hash||'').replace(/^#\/?/,'');
  const [name,qs]=h.split('?');
  const p={};(qs||'').split('&').filter(Boolean).forEach(kv=>{const[k,v]=kv.split('=');p[k]=decodeURIComponent(v||'');});

/* ============ 导航栈 / 转场（push/pop，仅手机端） ============ */
let navStack=[];
let navGesture=false;     /* 本次 pop 由边缘跟手手势接管，转场由手势驱动 */
function showScreen(name){
  if(IS_DESKTOP)return deskShowScreen(name);
  name=name||'home';
  if(!$('#scr-'+name)){   /* 未知路由：回退到首页，避免 null.classList 报错 */
    if(name!=='home')location.replace('#/home');
    return;
  }
  const prev=navStack[navStack.length-1];
  const oldEl=prev?$('#scr-'+prev):null;
  const newEl=$('#scr-'+name);
  $('#fab').style.visibility=(name==='home')?'visible':'hidden';
  $('#scr-home').classList.toggle('behind',name!=='home');
  if(prev===name){newEl.classList.add('active');$('#app').scrollLeft=0;return;}
  let dir;
  const i=navStack.indexOf(name);
  if(i>=0){navStack=navStack.slice(0,i+1);dir=-1;}
  else{navStack.push(name);dir=1;}
  const rm=reduceMotion();
  $$('.screen').forEach(s=>s.classList.remove('nav-enter','nav-leave'));
  if(!oldEl){
    $$('.screen').forEach(s=>s.classList.remove('active','nav-under'));
    newEl.classList.add('active');
  } else if(dir>0){
    /* push：新屏从右滑入，旧屏原位可见（不位移） */
    oldEl.classList.add('nav-under');oldEl.classList.remove('active');
    newEl.classList.add('active');
    if(rm){oldEl.classList.remove('nav-under');}
    else{
      newEl.classList.add('nav-enter');void newEl.offsetWidth;
      requestAnimationFrame(()=>requestAnimationFrame(()=>newEl.classList.remove('nav-enter')));
      setTimeout(()=>{oldEl.classList.remove('nav-under');},420);
    }
    const body=newEl.querySelector('.screen-body');
    if(body){body.scrollTop=0;body.scrollLeft=0;}
  } else {
    /* pop：当前屏向右滑出，目标屏在原位 */
    newEl.classList.add('active');newEl.classList.remove('nav-under');
    if(!navGesture){
      if(rm)oldEl.classList.remove('active');
      else{
        oldEl.classList.remove('active');oldEl.classList.add('nav-leave');
        setTimeout(()=>oldEl.classList.remove('nav-leave'),420);
      }
    }
    /* navGesture=true：旧屏由手势自己的内联 transform 收尾，不碰它 */
    navGesture=false;
  }
  $('#app').scrollLeft=0;
}
/* ============ 左边缘跟手返回（手指 1:1 拖动；位移+速度+方向，可中途反向） ============ */
function initEdgeBack(){
  if(IS_DESKTOP)return;
  const EDGE=22, TH=0.25;
  let st=null;
  let edgeLockT=0; /* 最近一次左缘返回手势锁定的时间，用于抑制误触 click */
  const app=$('#app');
  let hint=document.createElement('div');hint.className='nav-edge-hint';app.appendChild(hint);
  /* 手势一旦锁定并拖动过，指尖在返回按钮附近抬手可能合成 click 导致"被点了一下"：
     锁定后 400ms 内捕获阶段吞掉落在屏幕内的合成点击（水平滑动非点击意图） */
  window.addEventListener('click',e=>{
    if(edgeLockT&&performance.now()-edgeLockT<150){
      e.stopPropagation();e.preventDefault();
    }
  },true);
  /* 150ms 后自然失效（只吞手势抬手合成的那一击，不影响后续正常点击） */
  const _abort=()=>{
    if(st&&st.locked){
      st.el.classList.remove('nav-dragging');
      if(st.under)st.under.classList.remove('nav-under');
      hint.classList.remove('show');
      st.el.style.transition='transform var(--dur-3) var(--ease-spring-soft)';
      st.el.style.transform='';
      setTimeout(()=>{st.el.style.transition='';st.el.style.zIndex='';},320);
    }
    st=null;
  };
  function anyOverlay(){
    return $('#noteAiPanel').classList.contains('open')
      || $('#chatDrawer').classList.contains('open')
      || $('#nbPicker').classList.contains('open')
      || $('#mask').classList.contains('show')
      || $('#modal').classList.contains('show')
      || document.querySelector('.img-viewer.show'); /* #11 大图查看器优先接管手势 */
  }
  function topEl(){const t=navStack[navStack.length-1];return t?$('#scr-'+t):null;}
  function underEl(){const u=navStack[navStack.length-2];return u?$('#scr-'+u):null;}
  window.addEventListener('pointerdown',e=>{
    if(navStack.length<1)return;
    const top=topEl();
    if(!top||top.id==='scr-home'||anyOverlay())return;
    if(e.clientX>EDGE)return;
    if(!underEl())return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    /* 起手点落在按钮/输入控件上（如返回键、主题分段按钮、列表行按钮）：
       不接管为返回手势，交给控件自身的点击处理 */
    if(e.target&&e.target.closest&&e.target.closest('button,a,input,textarea,select,.seg,.switch'))return;
    /* 多指时只认第一根；忽略非主键触摸（手掌/第二指） */
    if(st&&st.id!=null)return;
    st={id:e.pointerId,el:top,startX:e.clientX,startY:e.clientY,locked:false,
      dx:0,lastX:e.clientX,lastY:e.clientY,lastT:performance.now(),vel:0};
  },{passive:true});
  /* 抬手时指尖是否落在交互控件上（控件自己的点击应生效，不能触发返回） */
  function endOverControl(x,y){
    let el=null;
    try{el=document.elementFromPoint(x,y);}catch(_){return false;}
    return !!(el&&el.closest&&el.closest('button,a,input,textarea,select,.seg,.switch'));
  }
  window.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const dx=e.clientX-st.startX,dy=e.clientY-st.startY;
    if(!st.locked){
      if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
      /* 纵向滚动优先：横向意图必须明显（dx 大于纵向 1.6 倍且达到 12px），
         防止左缘纵向滚动/点按抖动误锁成返回手势 */
      if(Math.abs(dy)*1.6>Math.abs(dx)||Math.abs(dx)<12){st=null;return;}
      st.locked=true;st.under=underEl();
      if(st.under)st.under.classList.add('nav-under');
      st.el.classList.add('nav-dragging');st.el.style.zIndex='6';
      hint.classList.add('show');haptic(6);
    }else{
      /* 已锁定后轨迹转为明显纵向（拇指滚动），且未越过 1/3 屏宽：放弃手势，交回滚动 */
      if(Math.abs(dy)>2.2*Math.abs(dx)&&dx<window.innerWidth*0.3){_abort();return;}
    }
    const now=performance.now(),dt=Math.max(1,now-st.lastT);
    st.vel=st.vel*.5+((e.clientX-st.lastX)/dt)*.5;   /* px/ms，指数平滑 */
    st.lastX=e.clientX;st.lastY=e.clientY;st.lastT=now;
    /* 跟手：越往右阻尼越小（全程跟手），左越界硬止 */
    st.dx=Math.max(0,Math.min(window.innerWidth,dx));
    st.el.style.transform='translateX('+st.dx+'px)';
  },{passive:true});
  function finish(cancel){
    if(!st)return;const s=st;st=null;
    if(!s.locked){if(s.under)s.under.classList.remove('nav-under');return;}
    hint.classList.remove('show');
    /* 指尖落在按钮/分段控件上（例如从左缘拖到主题按钮再抬手）：
       判定为点按控件，取消返回，且不吞掉控件的 click */
    const onControl=endOverControl(s.lastX,s.lastY);
    if(!cancel&&onControl){cancel=true;}
    const velPxSec=s.vel*1000;
    /* 快速轻扫也必须至少走过 18% 屏宽，防止小幅度横向抖动误返回 */
    let commit=!cancel&&(s.dx>window.innerWidth*TH||(velPxSec>450&&s.dx>window.innerWidth*0.18));
    if(commit){
      edgeLockT=performance.now(); /* 真返回：吞掉抬手合成的 click */
    }else{
      if(s.under)s.under.classList.remove('nav-under');
      s.el.classList.remove('nav-dragging');
      s.el.style.transition='transform var(--dur-3) var(--ease-spring-soft)';
      s.el.style.transform='';
      setTimeout(()=>{s.el.style.transition='';s.el.style.zIndex='';},320);
      return;
    }
    s.el.classList.remove('nav-dragging');
    haptic(10);
    navGesture=true;
    s.el.style.transition='transform var(--dur-4) var(--ease-decel)';
    s.el.style.transform='translateX(100%)';
    s.el.style.zIndex='6';
    if(history.length>1)history.back();
    else{ /* 无历史时兜底：直接回首页并复位 */
      navGesture=false;
      go('home');
    }
    setTimeout(()=>{
      s.el.style.transition='';s.el.style.transform='';s.el.style.zIndex='';
      s.el.classList.remove('nav-leave','nav-under');
    },430);
  }
  window.addEventListener('pointerup',()=>finish(false));
  window.addEventListener('pointercancel',()=>finish(true));
}
/* 顶栏按钮的"滑动防误触"：在按钮上按下后移动超过 12px 视为滑动/滚动，
   吞掉抬手时合成的 click（手指在返回键上蹭到、滑出又滑回不会误触）；
   静止点按完全不受影响。 */
(function setupTopBarDragGuard(){
  const SLOP=12;
  const moved=new WeakMap();
  const start=new Map();
  window.addEventListener('pointerdown',e=>{
    const btn=e.target&&e.target.closest&&e.target.closest('.topbar button');
    if(!btn)return;
    start.set(e.pointerId,{x:e.clientX,y:e.clientY,btn});
    moved.delete(btn);
  },true);
  window.addEventListener('pointermove',e=>{
    const s=start.get(e.pointerId);
    if(!s)return;
    if(Math.hypot(e.clientX-s.x,e.clientY-s.y)>SLOP)moved.set(s.btn,true);
  },true);
  const clear=e=>{const s=start.get(e.pointerId);start.delete(e.pointerId);};
  window.addEventListener('pointerup',clear,true);
  window.addEventListener('pointercancel',clear,true);
  window.addEventListener('click',e=>{
    const btn=e.target&&e.target.closest&&e.target.closest('.topbar button');
    if(btn&&moved.get(btn)){
      e.stopPropagation();e.preventDefault();
      moved.delete(btn);
    }
  },true);
})();

/* ============ 边界阻尼（顶部/底部橡皮筋，非线性阻力，松手回弹） ============ */
function setupRubber(){
  if(IS_DESKTOP)return;
  const DAMP=.42,MAX=130;
  document.querySelectorAll('.screen-body,.paper-scroll,.nbp-scroll').forEach(el=>{
    if(el.__rb)return;el.__rb=1;
    let sy=0,locked=false;
    const release=()=>{
      el.style.transition='transform var(--dur-3) var(--ease-spring-soft)';
      el.style.transform='';
      setTimeout(()=>{el.style.transition='';el.style.transform='';},340);
    };
    el.addEventListener('touchstart',e=>{locked=false;sy=e.touches[0].clientY;},{passive:true});
    el.addEventListener('touchmove',e=>{
      if(reduceMotion())return;
      const dy=e.touches[0].clientY-sy;
      if(!locked){
        if(Math.abs(dy)<8)return;
        const atTop=el.scrollTop<=0;
        const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
        if(dy>0&&atTop)locked='top';
        else if(dy<0&&atBottom)locked='bottom';
        else return;
        el.style.transition='none';
      }
      e.preventDefault();  /* 阻止原生滚动与 overscroll 光晕，接管为橡皮筋 */
      const pull=Math.abs(e.touches[0].clientY-sy);
      const d=Math.min(MAX,pull*DAMP)*(locked==='top'?1:-1);
      el.style.transform='translateY('+d.toFixed(1)+'px)';
    },{passive:false});
    const end=()=>{if(locked){release();locked=false;}};
    el.addEventListener('touchend',end);
    el.addEventListener('touchcancel',end);
  });
}

/* #13 危险按钮 Press-to-Cancel：按下时红色确认区域；手指滑出按钮区域恢复常态，
   抬手不触发；不设 pointer capture，原生 click 仅在原位抬手时才会发生。
   对个别机型滑出仍补发的 click，用 document 捕获阶段一次性拦截，按下一次即清除。 */
(function setupPressCancel(){
  const PC_SEL='.sheet-opt.danger, .modal .btn-danger';
  let pcEl=null,pcInside=false;
  const inRect=(x,y,el,pad)=>{
    const r=el.getBoundingClientRect();
    return x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad;
  };
  document.addEventListener('pointerdown',e=>{
    if(!e.target.closest)return;
    const el=e.target.closest(PC_SEL);
    if(!el)return;
    pcEl=el;pcInside=true;
    el._pcBlock=0;
    el.classList.add('pc-pressed');
  },{passive:true});
  document.addEventListener('pointermove',e=>{
    if(!pcEl)return;
    const inside=inRect(e.clientX,e.clientY,pcEl,14);
    if(inside!==pcInside){
      pcInside=inside;
      pcEl.classList.toggle('pc-pressed',inside);
    }
  },{passive:true});
  const finish=e=>{
    if(!pcEl)return;
    const el=pcEl;
    const inside=e&&typeof e.clientX==='number'?inRect(e.clientX,e.clientY,el,14):false;
    if(!inside){
      el.classList.remove('pc-pressed');
      el._pcBlock=1;
      /* 没有补发 click 时，300ms 后自动失效，不影响下一次正常点按 */
      setTimeout(()=>{if(el._pcBlock)el._pcBlock=0;},300);
    }
    pcEl=null;
    setTimeout(()=>el.classList.remove('pc-pressed'),200);
  };
  document.addEventListener('pointerup',finish);
  document.addEventListener('pointercancel',finish);
  document.addEventListener('click',e=>{
    if(!e.target.closest)return;
    const el=e.target.closest(PC_SEL);
    if(!el)return;
    if(el._pcBlock){
      e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();
    }
    el._pcBlock=0;
  },true);
})();
function fmtDur(s){s=Math.max(0,Math.round(s));
  if(s<60)return s+' 秒';return Math.floor(s/60)+' 分'+(s%60)+' 秒';}
/* 通用任务进度：百分比 + X/Y + 已耗时 + 预计剩余（EMA），并上报原生通知 */
const TaskUI={
  t0:0,total:0,
  begin(title,total){this.t0=Date.now();this.total=total||1;
    $('#syncTitle').textContent=title;
    $('#syncOverlay').classList.add('show');this.update(0,'准备中…');},
  update(done,label){
    const pct=Math.round(done/this.total*100);
    $('#syncPct').textContent=pct+'%';
    const el=(Date.now()-this.t0)/1000;
    let etaStr='';let etaSec=0;
    if(done>0){const avg=el/done;etaSec=Math.round(avg*(this.total-done));
      etaStr=' · 预计剩余 '+fmtDur(etaSec);}
    $('#syncMsg').textContent=(label||'')+' · '+done+'/'+this.total
      +' · 已用 '+fmtDur(el)+etaStr;
    if(hasNative())Native.call('taskProgress',JSON.stringify(
      {pct,done,total:this.total,label:label||'',eta:etaSec})).catch(()=>{});
  },
  end(){$('#syncOverlay').classList.remove('show');
    if(hasNative())Native.call('taskProgress',JSON.stringify({done:true})).catch(()=>{});}
};

const RENDER_BATCH=240;
let _homeRendered=0,_renderLimit=RENDER_BATCH,_readyT=null,_homeDirty=null;
function renderNotes(noStagger){

  if(stagger){clearTimeout(_readyT);_readyT=setTimeout(()=>wrap.classList.add('ready'),650);}

/* 编辑返回主页的轻量更新：只重建/移动被编辑那一张卡，避免全量 innerHTML 重建 N 张。
   仅处理“筛选/视图未变、卡片集合相同、仅内容或排序位置变化”的常见路径；任何更复杂情况返回 false，交 renderNotes 全量兜底。 */
function reconcileHomeCard(id){
  const wrap=$('#notesWrap');
  if(!_homeRendered)return false;
  if(wrap.querySelector('.empty'))return false;
  const all=visibleNotes();
  const viewCls='notes-wrap '+(IS_DESKTOP?'list':(prefs.view==='grid'?'grid':'list'));
  const domCards=Array.from(wrap.querySelectorAll('.note-card'));
  const domIds=domCards.map(c=>c.dataset.id);
  const n=all.find(x=>x.id===id);
  if(!n)return false;                                  /* 卡被删/为空被移除：全量（会正确处理 empty） */
  /* 期望已渲染集合：保持现有已渲染数量，取排序后的前 domCards.length 张 */
  const expectIds=all.slice(0,domCards.length).map(x=>x.id);
  if(expectIds.length!==domIds.length)return false;
  const sameSet=expectIds.every(x=>domIds.includes(x));
  if(!sameSet)return false;                            /* 集合变化（换笔记本/有新增补位等）：全量 */
  if(wrap.className!==viewCls)wrap.className=viewCls;
  /* 重建该卡（关闭其入场动画），从旧位置移除，按新排序插入正确位置 */
  const tmp=document.createElement('div');tmp.innerHTML=cardHTML(n);
  const newEl=tmp.firstElementChild;newEl.style.animation='none';
  const newIndex=expectIds.indexOf(id);
  const oldEl=wrap.querySelector('.note-card[data-id="'+id+'"]');
  if(oldEl)oldEl.remove();
  let ref=null;
  for(let i=newIndex+1;i<expectIds.length;i++){
    const f=wrap.querySelector('.note-card[data-id="'+expectIds[i]+'"]');
    if(f){ref=f;break;}
  }
  wrap.insertBefore(newEl,ref||$('#notesMore')||null);
  return true;
}
/* 返回主页时消费编辑脏标记；返回 true 表示已就地更新、跳过全量 renderNotes */

function cardHTML(n){
  let preview,foot;
  if(n.type==='todo'){
    const done=n.todos.filter(t=>t.done).length,total=n.todos.length,pct=total?Math.round(done/total*100):0;
    const bodyText=stripHtml(n.content);
    if(bodyText){
      preview=esc(bodyText);
    }else{
      const undone=n.todos.filter(t=>!t.done).sort((a,b)=>(PRI_RANK[a.priority]??1)-(PRI_RANK[b.priority]??1));
      preview=total?(undone[0]?esc(undone[0].text):'全部事项已完成'):'暂无条目，点击添加';
    }
    foot='<span class="type-ico">'+I.todo+'待办'+attachMini(n)+'</span>'
      +'<span class="todo-progress"><span class="todo-bar"><i style="width:'+pct+'%"></i></span>'+done+'/'+total+'</span>';
  }else{
    let text=stripHtml(n.content);
    if(!text){
      if(/<img/.test(n.content))text=n.files.length?'[图片与附件]':'[图片]';
      else if(n.files.length)text=n.files.map(f=>f.name).join(' · ');
      else text='暂无内容';
    }
    preview=esc(text);
    foot='<span class="type-ico">'+(n.files.length?attachMini(n).trim():'')+'</span><span>'+fmtDate(n.updatedAt)+'</span>';
  }
  const _bg=IS_DESKTOP?'':' style="background:'+cardColor(n)+'"';
  return '<div class="note-card" data-id="'+n.id+'"'+_bg+'>'
    +'<span class="sel-circle">'+I.check+'</span>'
    +(n.pinned?'<span class="nc-pin">'+pinSvg()+'</span>':'')
    +'<div class="nc-title">'+esc(n.title||'无标题')+'</div>'
    +'<div class="nc-preview">'+preview+'</div>'
    +'<div class="nc-foot">'+foot+'</div></div>';
}

let selectMode=false,selected=new Set(),_justEnteredSel=0,_longPressEnterId=null;

/* 卡片交互统一委托：#notesWrap 上只绑一组监听，靠 data-id + 冒泡定位卡片，
   消除逐卡片 6 个监听器（N 卡从 6N 降到 6），渲染更快、内存更省。 */
function applyCardTilt(card,e){
  if(!card||reduceMotion())return;
  const r=card.getBoundingClientRect();
  const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  card.style.setProperty('--px',(px*100).toFixed(1)+'%');
  card.style.setProperty('--py',(py*100).toFixed(1)+'%');
  card.style.setProperty('--ry',((px-.5)*11).toFixed(2)+'deg');  /* 左右倾 ±5.5° */
  card.style.setProperty('--rx',((.5-py)*9).toFixed(2)+'deg');   /* 上下倾 ±4.5° */
  card.classList.add('pressing');
}
function clearCardTilt(card){
  if(!card)return;
  card.classList.remove('pressing');
  card.style.setProperty('--rx','0deg');card.style.setProperty('--ry','0deg');
}
function setupNotesDelegation(){
  const wrap=$('#notesWrap');let press=null;
  const cardFrom=el=>(el&&el.closest)?el.closest('.note-card'):null;
  wrap.addEventListener('pointerdown',e=>{
    const card=cardFrom(e.target);if(!card)return;
    if(selectMode)return;
    applyCardTilt(card,e);
    press={id:card.dataset.id,card:card,x:e.clientX,y:e.clientY,long:false,timer:null};
    press.timer=setTimeout(()=>{press.long=true;
      clearCardTilt(card);
      if(navigator.vibrate)navigator.vibrate(8);enterSelect(press.id);},450);
  });
  wrap.addEventListener('pointermove',e=>{
    if(press&&press.timer&&(Math.abs(e.clientX-press.x)>10||Math.abs(e.clientY-press.y)>10)){
      clearTimeout(press.timer);press.timer=null;clearCardTilt(press.card);}
  });
  const end=()=>{
    if(press){
      if(press.timer){clearTimeout(press.timer);press.timer=null;}
      clearCardTilt(press.card);
    }
  };
  wrap.addEventListener('pointerup',end);
  wrap.addEventListener('pointercancel',end);
  wrap.addEventListener('contextmenu',e=>{if(cardFrom(e.target))e.preventDefault();});
  wrap.addEventListener('click',e=>{
    const card=cardFrom(e.target);if(!card)return;
    const id=card.dataset.id;
    /* 长按抬手合成的 click 忽略 */
    if(press&&press.long){press.long=false;return;}

      /* 仅一次性忽略“长按进入多选时落在触发卡上的合成 click”；其他卡立即响应，可快速连续加选 */
      if(_longPressEnterId&&id===_longPressEnterId&&Date.now()-_justEnteredSel<350){_longPressEnterId=null;return;}
      toggleSelect(id);

    else {if(IS_DESKTOP)deskOpenNote(id);else go('edit','id='+id);}
  });
}

/* ============ 飞行删除 / FLIP 补位 ============ */
/* 卡片贝塞尔曲线飞向目标按钮（WAAPI 多段关键帧，多卡错峰），结束后回调 */
function flyToTrash(cards,targetEl,cb){
  if(reduceMotion()||!targetEl||!Element.prototype.animate){cb&&cb();return;}
  const tr=targetEl.getBoundingClientRect();
  const tx=tr.left+tr.width/2,ty=tr.top+tr.height/2;
  let done=0;const total=cards.length;
  const finish=()=>{
    targetEl.classList.add('target-hit');haptic(18);
    setTimeout(()=>targetEl.classList.remove('target-hit'),420);
    cb&&cb();
  };
  cards.forEach((c,i)=>{
    const r=c.getBoundingClientRect();
    const cl=c.cloneNode(true);
    c.classList.add('flight-out');   /* 真卡先隐藏，克隆体接管视觉 */
    cl.classList.remove('flight-out');
    cl.style.cssText+='position:fixed;left:'+r.left+'px;top:'+r.top+'px;width:'+r.width+'px;height:'+r.height+'px;margin:0;z-index:300;pointer-events:none;box-shadow:var(--shadow-lg);will-change:transform,opacity;animation:none';
    document.body.appendChild(cl);
    const dx=tx-(r.left+r.width/2),dy=ty-(r.top+r.height/2);
    const delay=Math.min(i*26,180);
    const anim=cl.animate([
      {transform:'translate(0,0) scale(1) rotate(0)',opacity:1,easing:'cubic-bezier(.45,.1,.7,.4)'},
      {transform:'translate('+(dx*.55)+'px,'+(dy*.35-46)+'px) scale(.6) rotate(10deg)',opacity:.95,easing:'cubic-bezier(.5,.05,.8,.3)'},
      {transform:'translate('+dx+'px,'+dy+'px) scale(.08) rotate(24deg)',opacity:.08}
    ],{duration:480,delay:delay,fill:'forwards'});
    anim.onfinish=()=>{cl.remove();if(++done===total)finish();};
    anim.oncancel=()=>{cl.remove();if(++done===total)finish();};
  });
  if(!total)cb&&cb();
}
/* 带 FLIP 补位的首页重渲染：先记录卡片位置，重渲染后让其余卡片从旧位置平滑落位 */
function renderNotesWithFlip(){
  const wrap=$('#notesWrap');
  const snap=new Map();
  if(!reduceMotion()){
    wrap.querySelectorAll('.note-card').forEach(c=>{
      const r=c.getBoundingClientRect();snap.set(c.dataset.id,{left:r.left,top:r.top});
    });
  }
  renderNotes(true);
  if(reduceMotion())return;
  requestAnimationFrame(()=>{
    wrap.querySelectorAll('.note-card').forEach(c=>{
      const b=snap.get(c.dataset.id);if(!b)return;
      const a=c.getBoundingClientRect();
      const dx=b.left-a.left,dy=b.top-a.top;
      if(!dx&&!dy)return;
      const st=c.style;
      st.transition='none';st.transform='translate('+dx+'px,'+dy+'px)';void c.offsetWidth;
      st.transition='transform .34s var(--ease-spring-soft)';
      requestAnimationFrame(()=>st.transform='');
      setTimeout(()=>{st.transition='';st.transform='';},380);
    });
  });
}

/* ============ 编辑历史（撤销 / 重做） ============ */
let histUndo=[],histRedo=[],histLastSnap='',histLastType='',histLastT=0;
const HIST_MAX=120;
function histReset(snap){
  histUndo=[];histRedo=[];histLastSnap=snap;histLastType='';histLastT=0;
  updateHistBtns();

/* 正文图片对账：正文里已删除的图片，对应文件一并清理，避免孤儿 */
function reconcileImages(n){
  const body=$('#paperBody');
  const used=new Set([...body.querySelectorAll('img.note-img[data-id]')].map(im=>im.dataset.id));
  const dead=n.files.filter(f=>f.kind==='image'&&!used.has(f.id));
  if(!dead.length)return;
  dead.forEach(f=>Store.removeBlob(f).catch(()=>{}));
  n.files=n.files.filter(f=>!dead.includes(f));
}
function onEditorInput(e,cur){
  const now=Date.now();
  const t=(e&&e.inputType)||'',data=(e&&e.data)||'';
  const cont=['insertText','insertCompositionText','deleteContentBackward','deleteContentForward'];
  let startNew=true;
  if(cont.includes(t)){
    const isBreak=/[\s，。、；：,.!?！？；]/.test(data);
    startNew=(histLastType!==t||now-histLastT>=400)||isBreak;
  }
  if(startNew){
    histUndo.push(Object.assign({h:histLastSnap},getCaretOffsets()));
    if(histUndo.length>HIST_MAX)histUndo.shift();
    histRedo=[];
  }
  histLastSnap=cur;histLastType=t;histLastT=now;
  updateHistBtns();
}
function histBeforeFormat(){
  histUndo.push(makeSnap());
  if(histUndo.length>HIST_MAX)histUndo.shift();
  histRedo=[];histLastSnap=$('#paperBody').innerHTML;histLastT=Date.now();
  updateHistBtns();
}
/* 选区在正文内的绝对字符偏移（起/止），随快照保存 */
function absOffset(root,node,offset){
  try{const r=document.createRange();r.selectNodeContents(root);r.setEnd(node,offset);
    return r.toString().length;}catch(e){return -1;}
}
function getCaretOffsets(){
  const body=$('#paperBody'),sel=getSelection();
  if(!sel.rangeCount||!body.contains(sel.anchorNode))return {a:-1,b:-1};
  const r=sel.getRangeAt(0);
  return {a:absOffset(body,r.startContainer,r.startOffset),
          b:absOffset(body,r.endContainer,r.endOffset)};
}
function makeSnap(){const body=$('#paperBody');return Object.assign({h:body.innerHTML},getCaretOffsets());}
function locateOffset(root,target){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);let t,acc=0;
  while((t=w.nextNode())){const len=t.nodeValue.length;
    if(target<=acc+len)return [t,target-acc];acc+=len;}
  return null;
}
function setAbsOffsets(body,start,end){
  const s=locateOffset(body,start),e=locateOffset(body,end==null?start:end);
  if(!s)return false;
  const r=document.createRange();r.setStart(s[0],s[1]);
  if(e)r.setEnd(e[0],e[1]);else r.collapse(true);
  const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
  return true;
}
function restoreSnap(snap){
  const body=$('#paperBody'),n=cur();
  const sb=document.querySelector('#paperScroll');const keepScroll=sb?sb.scrollTop:0;
  body.innerHTML=snap.h;hydrateImages();
  if(n)n.content=cleanBodyHTML();
  histLastSnap=body.innerHTML;
  /* 光标还原到编辑处（不再强制文末），并保持原地滚动，撤销不跳位 */
  if(snap.a>=0)setAbsOffsets(body,snap.a,snap.b);
  if(sb)sb.scrollTop=keepScroll;
}
function undo(){
  if(!histUndo.length)return;
  const body=$('#paperBody');
  histRedo.push(makeSnap());
  restoreSnap(histUndo.pop());

}
function redo(){

/* 富文本执行（按下即执行，选区已保留） */
function prExec(c){

  if(c==='redo'){redo();syncPrState();return;}
  ed.focus();

    let s=parseInt(document.queryCommandValue('fontSize')||'3',10);if(isNaN(s))s=3;
    s=c==='inc'?Math.min(7,s+1):Math.max(1,s-1);
