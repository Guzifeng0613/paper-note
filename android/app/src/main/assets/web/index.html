async function runChunkTargets(targets,hooks){
  let done=0,totalChunks=0;const N=targets.length,B=100;
  let sink={items:[]};
  const flush=async()=>{if(sink.items.length){await KB.batch(sink.items);sink={items:[]};}};
  for(let i=0;i<N;i++){
    if(hooks&&hooks.shouldStop&&hooks.shouldStop()){await flush();break;}
    const r=await chunkNote(targets[i],{
      shouldStop:hooks&&hooks.shouldStop,
      onStep:(k,sc)=>{
        if(hooks&&hooks.progress)
          hooks.progress(Math.round(((i+(k+1)/sc)/N)*100),
            (targets[i].title||'未命名')+'（'+(k+1)+'/'+sc+'）');
      }},sink);
    totalChunks+=r.count||0;done++;
    if(hooks&&hooks.progress)
      hooks.progress(Math.round(((i+1)/N)*100),'已完成 '+done+'/'+N);
    if((i+1)%B===0)await flush();
  }
  await flush();
  return {done,totalChunks};
}

/* ============================================================
   P2：端内混合检索（检索层 = 效果第一杠杆）
   BM25 全文 + 标题/元数据，RRF 融合，轻量重排；向量路可插拔
   ============================================================ */
/* 中文友好分词：汉字 unigram + bigram（免词典、召回稳），拉丁/数字整词 */
function qtokenize(text){
  const s=(text||'').toLowerCase();const toks=[];
  (s.match(/[一-鿿]+/g)||[]).forEach(run=>{
    for(const ch of run)toks.push(ch);
    for(let i=0;i<run.length-1;i++)toks.push(run.slice(i,i+2));
  });
  (s.match(/[a-z0-9]+/g)||[]).forEach(w=>toks.push(w));
  return toks;
}
const QSTOP=new Set(['的','了','是','我','你','他','她','它','和','与','吗','呢','什么','怎么','如何','请问','一下','这个','那个','可以','还有','我们','你们','他们','知道','告诉','以及','或者','还是','但是','因为','所以','啊','吧','呀','哦','的话']);
/* BM25（rank_bm25 思路，免部署） */
function buildBM25(docs){
  const N=docs.length,k1=1.5,b=0.75;
  const df={},docLen=new Array(N);
  docs.forEach((d,i)=>{docLen[i]=d.tokens.length;
    new Set(d.tokens).forEach(t=>df[t]=(df[t]||0)+1);});
  const avgdl=docLen.reduce((a,x)=>a+x,0)/(N||1);
  return {score(qt,i){
    const tf={};docs[i].tokens.forEach(t=>tf[t]=(tf[t]||0)+1);
    const dl=docLen[i];let s=0;
    new Set(qt).forEach(t=>{
      if(!(t in df))return;
      const f=tf[t]||0,idf=Math.log(1+(N-(df[t]||0)+0.5)/((df[t]||0)+0.5));
      s+=idf*(f*(k1+1))/(f+k1*(1-b+b*dl/(avgdl||1)));
    });return s;
  }};
}
/* 查询改写：去停用词取核心词（整句保留做短语命中） */
function expandQuery(q){
  const terms=Array.from(new Set(qtokenize(q).filter(t=>!QSTOP.has(t))));
  return {terms};
}
/* 向量路（可插拔）：配置 OpenAI 兼容 embedding 才启用，失败静默降级 */
/* ============================================================
   API 配置（ccswitch 风格：多套 OpenAI 兼容配置，本地保存/可切换/可测连通）
   ============================================================ */
function cfgUid(){return 'cfg'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
/* 旧单套 prefs.ai → 多配置（仅一次） */
function migrateAiConfig(){
  if(prefs.ais&&Array.isArray(prefs.ais.list)){
    if(!prefs.ais.cur&&prefs.ais.list.length)prefs.ais.cur=prefs.ais.list[0].id;return;}
  const list=[];
  if(prefs.ai&&(prefs.ai.key||prefs.ai.baseUrl))
    list.push({id:cfgUid(),name:'我的配置',baseUrl:prefs.ai.baseUrl||'',
      key:prefs.ai.key||'',model:prefs.ai.model||'',embModel:prefs.ai.embeddingModel||'',
      addedAt:Date.now()});
  prefs.ais={cur:list.length?list[0].id:null,list};
  delete prefs.ai;
}
const AIs={
  all(){return (prefs.ais&&prefs.ais.list)||[];},
  get(id){return this.all().find(x=>x.id===id)||null;},
  current(){const l=this.all();
    return l.find(x=>x.id===(prefs.ais&&prefs.ais.cur))||l[0]||null;},
  add(cfg){const c={id:cfgUid(),name:cfg.name||('配置 '+(this.all().length+1)),
    baseUrl:cfg.baseUrl||'',key:cfg.key||'',model:cfg.model||'',
    embModel:cfg.embModel||'',addedAt:Date.now(),last:null};
    if(cfg.vision===true)c.vision=true;   /* 仅明确声明视觉才标记；否则交给模型名判断 */
    prefs.ais.list.push(c);
    if(!prefs.ais.cur)prefs.ais.cur=c.id;
    persistPrefs();Logs.info('AI配置','新增配置：'+c.name);return c;},
  update(id,cfg){const c=this.get(id);if(!c)return;
    ['name','baseUrl','key','model','embModel'].forEach(k=>{
      if(cfg[k]!=null)c[k]=cfg[k];});
    if(cfg.vision===true)c.vision=true;else delete c.vision;
    persistPrefs();Logs.info('AI配置','更新配置：'+c.name);},
  remove(id){prefs.ais.list=prefs.ais.list.filter(x=>x.id!==id);
    if(prefs.ais.cur===id)prefs.ais.cur=prefs.ais.list.length?prefs.ais.list[0].id:null;
    persistPrefs();Logs.info('AI配置','删除配置 '+id);},
  setCur(id){const c=this.get(id);if(!c)return;
    prefs.ais.cur=id;persistPrefs();Logs.info('AI配置','切换当前配置：'+c.name);}
};
async function vectorRank(children,query,size){
  const ai=AIs.current();
  const url=((ai&&ai.baseUrl)||'').replace(/\/$/,'');
  const key=(ai&&ai.key)||'',model=(ai&&ai.embModel)||'';
  if(!url||!key||!model)return [];
  try{
    const emb=async txt=>{
      const r=await fetch(url+'/embeddings',{method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
        body:JSON.stringify({model,input:txt})});
      if(!r.ok)throw new Error('embedding http '+r.status);
      return (await r.json()).data[0].embedding;
    };
    const qv=await emb(query);const scored=[];
    for(const c of children){
      const cv=await emb(c.text);
      let dot=0,nq=0,nv=0;
      for(let i=0;i<qv.length;i++){dot+=qv[i]*cv[i];nq+=qv[i]*qv[i];nv+=cv[i]*cv[i];}
      scored.push({id:c.id,s:dot/(Math.sqrt(nq)*Math.sqrt(nv)||1)});
    }
    return scored.filter(x=>!isNaN(x.s)).sort((a,b)=>b.s-a.s).slice(0,size);
  }catch(e){return [];}
}
/* 主入口：多路召回 → RRF 融合 → 轻量重排 → Small-to-Big 回父块 */
async function knowledgeSearch(query,opts){
  opts=opts||{};const limit=opts.limit||20;
  const all=await KB.allChunks();
  let children=all.filter(c=>c.level==='child');
  if(opts.noteIds){const nset=new Set(opts.noteIds);children=children.filter(c=>nset.has(c.noteId));}
  const docs=children.map(c=>({id:c.id,tokens:qtokenize(c.text)}));
  const bm=buildBM25(docs);
  const {terms}=expandQuery(query);
  const ql=query.trim().toLowerCase();
  const bmRank=children.map((c,i)=>({id:c.id,s:bm.score(terms,i)}))
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,limit*2);
  const metaRank=children.map(c=>{
    let s=0;const cl=(c.text||'').toLowerCase();
    if(ql&&cl.includes(ql))s+=4;
    if(c.crumbs){const cr=c.crumbs.toLowerCase();
      const titlePart=cr.split(' / ').slice(-1)[0]||'';
      if(ql&&titlePart.includes(ql))s+=3;
      if(ql&&cr.includes(ql))s+=1.2;}
    let hit=0;terms.forEach(t=>{if(cl.includes(t))hit++;});
    return {id:c.id,s:hit*0.25+s};
  }).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,limit*2);
  const vr=await vectorRank(children,query,limit*2);
  const K=60,fused={};
  [bmRank,metaRank,vr].forEach(rank=>rank.forEach((x,i)=>{
    fused[x.id]=(fused[x.id]||0)+1/(K+i+1);}));
  const byId=Object.fromEntries(children.map(c=>[c.id,c]));
  let ranked=Object.keys(fused).map(id=>{
    const c=byId[id],cl=(c.text||'').toLowerCase();let boost=0;
    if(ql&&cl.includes(ql))boost+=0.2;
    const cover=terms.length?terms.filter(t=>cl.includes(t)).length/terms.length:0;
    return {id,score:fused[id]+boost+cover*0.12,child:c};
  }).sort((a,b)=>b.score-a.score);
  const pmap=Object.fromEntries(all.filter(c=>c.level==='parent').map(c=>[c.id,c]));
  const results=[];const seenP=new Set(),seenN=new Set();
  for(const r of ranked){
    const pid=r.child.parentId;
    if(seenP.has(pid))continue;
    const par=pmap[pid]||r.child;
    const nid=par.noteId;
    /* 同一便签只保留最相关的一个父块，来源不重复 */
    if(nid!=null&&seenN.has(String(nid)))continue;
    seenP.add(pid);if(nid!=null)seenN.add(String(nid));
    results.push({parent:par,hit:r.child,score:r.score});
    if(results.length>=limit)break;
  }
  return results;
}

/* 高亮检索词（转义后替换，长词优先） */
function highlightText(text,ql){
  let html=esc(text);
  const terms=Array.from(new Set(qtokenize(ql).filter(t=>!QSTOP.has(t)&&t.length>=2)))
    .sort((a,b)=>b.length-a.length).slice(0,8);
  terms.forEach(t=>{
    const safe=esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    html=html.replace(new RegExp(safe,'g'),m=>'<mark>'+m+'</mark>');
  });
  return html;
}

/* ---- AI（检索上下文 + LLM 生成 + 引用） ---- */
/* filetext 缓存展开为纯文本（带位置），限量避免附件过长撑爆上下文 */
function attachmentRecToText(rec,maxLen){
  if(!rec||!rec.data)return '';
  const segs=fileTextSegments(rec);
  let t=segs.map(s=>(s.loc?'['+s.loc+'] ':'')+s.text).join('\n');
  if(t.length>maxLen)t=t.slice(0,maxLen)+'…';
  return t.trim();
}
/* 命中切片若带附件索引：取回相关附件正文（缓存优先，缺失现场解析），随上下文一起发给模型 */
async function buildAttachmentContext(refs){
  const need=new Map();
  const addMeta=a=>{if(a&&a.id&&!need.has(a.id))need.set(a.id,a);};
  for(const r of refs){
    const p=r.parent;
    if(p&&p.fileId)addMeta({id:p.fileId,idx:p.fileIdx||0,name:p.fileName||'附件'});
    if(p&&p.attachments)p.attachments.forEach(addMeta);
  }
  if(!need.size)return '';
  const blocks=[];
  for(const [id,meta] of need){
    let rec=await KB.getFileText(id).catch(()=>null);
    if(!rec||!rec.data||rec.data.kind==='unsupported'||rec.data.kind==='error'){
      try{rec=await fileTextFor({id,name:meta.name,idx:meta.idx,kind:meta.kind});}catch(e){rec=null;}
    }
    const txt=attachmentRecToText(rec,2000);
    if(txt)blocks.push('〖附件：'+meta.name+'〗\n'+txt);
  }
  return blocks.length?('\n\n相关附件内容（随命中切片的附件索引一并提供）：\n'+blocks.join('\n\n')):'';
}
async function runAi(q){
  const box=srBody();const ai=AIs.current();
  if(!ai||!ai.baseUrl||!ai.key||!ai.model){
    box.innerHTML='<div class="sr-loading">还没配置 AI 接口。<br>请到 设置 → AI 配置 添加一套 OpenAI 兼容接口。</div>';return;}
  box.innerHTML='<div class="sr-loading">正在检索并思考…</div>';
  let refs=[];
  try{refs=await knowledgeSearch(q,{limit:8});}catch(e){refs=[];}
  const ctx=refs.map((r,i)=>'【来源'+(i+1)+'】'+liveCrumb(r)+'\n'+r.parent.text).join('\n\n');
  const attachCtx=await buildAttachmentContext(refs);
  const messages=[
    {role:'system',content:'你是严谨的个人知识库助手。只能依据下面参考资料回答；资料不足要明确说明；回答中用[1][2]标注来源编号。\n\n参考资料：\n'+(ctx||'(无)')+attachCtx},
    {role:'user',content:q}];
  const aiIcoS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="3.2"/></svg>';
  const refsBoxHtml=()=>refs.length?('<div class="aia-refs"><div class="arf-h">参考来源（点击打开）</div>'+
    refs.map((r,i)=>'<button class="aia-ref" data-nid="'+r.parent.noteId+'"><b>['+(i+1)+']</b> '+
      esc(liveCrumb(r))+'</button>').join('')+'</div>'):'';
  box.innerHTML='<div class="ai-thread"><div class="ai-q-bubble">'+esc(q)+'</div>'
    +'<div class="ai-a-wrap"><div class="ai-avatar">'+aiIcoS+'</div>'
    +'<div class="ai-a-bubble"><div class="aia-txt" id="aiStream"></div><div id="aiRefs"></div></div></div></div>';
  try{
    const resp=await fetch(ai.baseUrl.replace(/\/$/,'')+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.key},
      body:JSON.stringify({model:ai.model,messages,temperature:0.3,stream:true})});
    if(!resp.ok||!resp.body){
      let hint=(resp.status===401||resp.status===403)?'API Key 无效':resp.status===404?'地址或模型有误':('HTTP '+resp.status);
      box.innerHTML='<div class="sr-loading">AI 请求失败：'+hint+'</div>';
      Logs.error('搜索','AI 问答失败 HTTP '+resp.status);return;}
    const reader=resp.body.getReader(),dec=new TextDecoder('utf-8');
    let ans='',buf='';const tgt=document.getElementById('aiStream');
    while(true){
      const {done,value}=await reader.read();
      if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        const s=ln.trim();if(!s.startsWith('data:'))continue;
        const d0=s.slice(5).trim();if(d0==='[DONE]')continue;
        try{const j=JSON.parse(d0);const d=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(d&&d.content){ans+=d.content;tgt.innerHTML=esc(ans);}}catch(e){}
      }
    }
    if(!ans.trim())ans='(空回答)';
    tgt.innerHTML=esc(ans);
    document.getElementById('aiRefs').innerHTML=refsBoxHtml();
    box.querySelectorAll('.aia-ref').forEach(b=>b.onclick=()=>{
      addRecent(q);location.hash='#/edit?id='+encodeURIComponent(b.dataset.nid);});
    Logs.info('搜索','AI 问答完成（流式），引用 '+refs.length+' 段');
  }catch(e){
    box.innerHTML='<div class="sr-loading">AI 请求失败：'+esc((e&&e.message)||String(e))+'</div>';
    Logs.error('搜索','AI 问答异常',(e&&e.stack)||String(e));}
}

const ChatStore={
  KEY:'zhipian.chats.v1',
  all(){try{return JSON.parse(localStorage.getItem(this.KEY))||[];}catch(e){return[];}},
  save(l){try{localStorage.setItem(this.KEY,JSON.stringify(l));}catch(e){}},
  get(id){return this.all().find(c=>c.id===id)||null;},
  create(){
    const c={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      title:'新对话',messages:[],createdAt:Date.now(),updatedAt:Date.now()};
    const l=this.all();l.unshift(c);this.save(l);return c;},
  update(id,fn){const l=this.all();const c=l.find(x=>x.id===id);
    if(c){fn(c);c.updatedAt=Date.now();this.save(l);}return c;},
  remove(id){this.save(this.all().filter(c=>c.id!==id));}
};

function chatGroupOf(ts){
  const now=new Date();
  const startToday=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  if(ts>=startToday)return '今天';
  if(ts>=startToday-7*864e5)return '7 天内';
  if(ts>=startToday-30*864e5)return '30 天内';
  return '更早';
}

/* 轻量且安全的 markdown → HTML（先转义再标记，防 XSS） */
function mdInline(s){
  s=s.replace(/`([^`]+)`/g,(m,c)=>'<code>'+c+'</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+)\)/g,
    (m,t,u)=>'<a href="'+u+'" rel="noopener">'+t+'</a>');
  return s;
}
function mdToHtml(src){
  const text=esc(src==null?'':String(src)).replace(/\r\n?/g,'\n');
  const lines=text.split('\n');let out=[],i=0,para=[];
  const pushPara=()=>{if(para.length){out.push('<p>'+para.map(mdInline).join('<br>')+'</p>');para=[];}};
  while(i<lines.length){
    const ln=lines[i];
    if(/^```/.test(ln.trim())){
      pushPara();const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i].trim())){buf.push(lines[i]);i++;}
      i++;out.push('<pre><code>'+buf.join('\n')+'</code></pre>');continue;}
    const h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){pushPara();const lv=h[1].length;out.push('<h'+lv+'>'+mdInline(h[2])+'</h'+lv+'>');i++;continue;}
    if(/^\s*&gt;\s?/.test(ln)){
      pushPara();const bq=[];
      while(i<lines.length&&/^\s*&gt;\s?/.test(lines[i])){bq.push(lines[i].replace(/^\s*&gt;\s?/,''));i++;}
      out.push('<blockquote>'+bq.map(mdInline).join('<br>')+'</blockquote>');continue;}
    if(/^\s*[-*]\s+/.test(ln)){
      pushPara();const items=[];
      while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*[-*]\s+/,''));i++;}
      out.push('<ul>'+items.map(x=>'<li>'+mdInline(x)+'</li>').join('')+'</ul>');continue;}
    if(/^\s*\d+[.)]\s+/.test(ln)){
      pushPara();const items=[];
      while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){items.push(lines[i].replace(/^\s*\d+[.)]\s+/,''));i++;}
      out.push('<ol>'+items.map(x=>'<li>'+mdInline(x)+'</li>').join('')+'</ol>');continue;}
    if(/^\s*([-*_])\1{2,}\s*$/.test(ln)){pushPara();out.push('<hr>');i++;continue;}
    if(ln.trim()===''){pushPara();i++;continue;}
    para.push(ln);i++;
  }
  pushPara();
  return out.join('');
}

  const scope=chatScope();
  if(scope.type==='notebook'&&!scope.noteIds.length)toast('当前笔记本暂无便签，知识库为空');
  /* 放行联网：① 触发词“联网搜索”；② 模型为千问/智谱时默认开启。
     咒语从检索词中剥离，检索更准；联网参数按各厂商官方方式分别传 */
  const spellNet=/联网搜索|搜索网络|联网查询|web[ ]?search/i.test(text);
  const isQwen=/qwen|千问/i.test(ai.model||''),isGlm=/glm|智谱|chatglm/i.test(ai.model||'');
  const allowNet=spellNet||isQwen||isGlm;
  const cleanQ=text.replace(/联网搜索|搜索网络|联网查询|web[ ]?search/ig,'').trim()||text;
  let refs=[];
  try{refs=await knowledgeSearch(cleanQ,{limit:8,noteIds:scope.noteIds});}catch(e){refs=[];}
  const kbCtx=refs.map((r,i)=>'【来源'+(i+1)+'】'+liveCrumb(r)+'\n'+r.parent.text).join('\n\n');
  let attachCtx='';try{attachCtx=await buildAttachmentContext(refs);}catch(e){}
  const scopeDesc=scope.type==='all'?'全部便签（'+scope.noteIds.length+' 篇）'
    :('笔记本「'+scope.name+'」（'+scope.noteIds.length+' 篇）');
  const systemMsg={role:'system',content: allowNet ? (
    '本次你已被授权联网搜索，不必局限于知识库。你可读取的知识库范围：'+scopeDesc+
    '。先参考下面资料；资料不足或涉及时效性信息时使用联网搜索获取最新网页，结合后回答；'
    +'联网内容注明来源链接，知识库内容用[1][2]标注。\n\n参考资料：\n'+(kbCtx||'(该范围内暂无相关笔记)')+attachCtx)
    :('你是严谨的个人知识库助手。你可读取的知识库范围：'+scopeDesc+
    '。只能依据下面参考资料回答；该范围内若资料不足要明确说明，可结合常识但需与资料区分；回答中用[1][2]标注来源编号。\n\n参考资料：\n'+
    (kbCtx||'(该范围内暂无相关笔记)')+attachCtx)};
  const msgs=[systemMsg,...ChatStore.get(cid).messages
    .map(m=>({role:m.role==='user'?'user':'assistant',content:m.content}))];
  let ans='';
  try{
    const resp=await fetch(ai.baseUrl.replace(/\/$/,'')+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+ai.key},
      body:JSON.stringify((()=>{const p={model:ai.model,messages:msgs,temperature:0.6,stream:true};
        if(allowNet){
          if(isQwen)p.enable_search=true;
          else if(isGlm)p.tools=[{type:'web_search',web_search:{enable:true}}];
          /* 仅咒语、模型未知：不塞可能报错的参数，靠放行 system 提示 */
        }
        return p;})())});
    const bubble=tmp.querySelector('.m-bubble');
    if(!resp.ok||!resp.body){
      const hint=(resp.status===401||resp.status===403)?'API Key 无效':resp.status===404?'地址或模型有误':('HTTP '+resp.status);
      bubble.innerHTML='<span style="color:var(--danger)">请求失败：'+hint+'</span>';
      Logs.error('AI对话','请求失败 HTTP '+resp.status);
      chatSending=false;updateChatSendBtn();return;}
    const reader=resp.body.getReader(),dec=new TextDecoder('utf-8');let buf='';
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop();
      for(const ln of lines){
        const s=ln.trim();if(!s.startsWith('data:'))continue;
        const d0=s.slice(5).trim();if(d0==='[DONE]')continue;
        try{const j=JSON.parse(d0);const d=j.choices&&j.choices[0]&&j.choices[0].delta;
          if(d&&d.content){ans+=d.content;bubble.innerHTML=mdToHtml(ans);body.scrollTop=body.scrollHeight;}}catch(e){}
      }
    }
    if(!ans.trim())ans='(空回答)';
    bubble.innerHTML=mdToHtml(ans);
    const msgRefs=refs.map(r=>{
      const cn=notes.find(x=>String(x.id)===String(r.parent.noteId));
      return {noteId:r.parent.noteId,title:cn?crumbsFor(cn):(r.parent.crumbs||'原便签')};
    });
    ChatStore.update(cid,cc=>{
      cc.messages.push({role:'assistant',content:ans,ts:Date.now(),refs:msgRefs});
      if(!cc.title||cc.title==='新对话'){
        const fu=cc.messages.find(m=>m.role==='user');
        cc.title=fu?fu.content.slice(0,18):'新对话';}
    });
    renderChatView(ChatStore.get(cid));
    Logs.info('AI对话','完成一轮：'+ChatStore.get(cid).title);
  }catch(e){
    tmp.querySelector('.m-bubble').innerHTML='<span style="color:var(--danger)">请求失败：'+
      esc((e&&e.message)||String(e))+'</span>';
    Logs.error('AI对话','异常',(e&&e.stack)||String(e));}
  chatSending=false;updateChatSendBtn();
}

function noteContextText(n){
  const parts=[];
  if(n.title)parts.push('标题：'+n.title);
  if(n.content){
    let md=htmlToMarkdown(n.content);
    md=md.replace(/\n{3,}/g,'\n\n').trim();
    if(md)parts.push('正文：\n'+md);}
  if(Array.isArray(n.todos)&&n.todos.length)
    parts.push('待办：\n'+n.todos.map(t=>(t.done?'[x]':'[ ]')+' '+(t.text||'')).join('\n'));
  if(Array.isArray(n.files)&&n.files.length)
    parts.push('附件：'+n.files.map(f=>(f.size||0)>ATTACH_INLINE_LIMIT
      ?(f.name+'（'+formatSize(f.size)+'，超过10MB仅提供索引）'):f.name).join('、'));
  return parts.join('\n\n');
}

      bubble.innerHTML='<span style="color:var(--danger)">请求失败：'+hint+'</span>';
      Logs.error('本页问答','失败 HTTP '+resp.status);naiSending=false;return;}
    const reader=resp.body.getReader(),dec=new TextDecoder('utf-8');let buf='';
    while(true){

      for(const ln of lines){

          if(d&&d.content){ans+=d.content;bubble.innerHTML=mdToHtml(ans);body.scrollTop=body.scrollHeight;}}catch(e){}

/* ============================================================
   API 配置管理（ccswitch 风格）+ 连通性测试
   ============================================================ */
async function httpVia(method,url,headers,body){
  if(hasNative())return await Native.call('httpRequest',{method,url,headers,body});
  const r=await fetch(url,{method,headers:headers||{},body:body||undefined});
  return {status:r.status,body:await r.text()};
}
/* 连通性测试：有模型→最小 chat/completions；无模型→GET /models */
async function testAiConn(cfg){
  const base=(cfg.baseUrl||'').replace(/\/$/,'');
  if(!base)return {ok:false,msg:'请先填写请求地址'};
  if(!/^https?:\/\//i.test(base))return {ok:false,msg:'地址需以 http:// 或 https:// 开头'};
  const headers={'Content-Type':'application/json'};
  if(cfg.key)headers['Authorization']='Bearer '+cfg.key;
  const t0=Date.now();let r;
  try{
    if(cfg.model)
      r=await httpVia('POST',base+'/chat/completions',headers,
        JSON.stringify({model:cfg.model,messages:[{role:'user',content:'ping'}],max_tokens:1}));
    else
      r=await httpVia('GET',base+'/models',headers,null);
    const ms=Date.now()-t0,st=r.status;
    if(st>=200&&st<300)return {ok:true,status:st,ms,msg:'连通成功（'+ms+'ms）'};
    let hint='';
    if(st===401||st===403)hint='鉴权失败：检查 API Key';
    else if(st===404)hint='未找到：检查请求地址或模型名';
    else if(st===429)hint='限流或额度不足';
    else hint=(r.body||'').slice(0,140);
    return {ok:false,status:st,ms,msg:'HTTP '+st+' '+hint};
  }catch(e){
    const m=((e&&e.message)||String(e));let hint=m;
    if(/resolve host|failed to fetch|networkerror|network/i.test(m))
      hint='无法连接服务器，请检查手机网络与请求地址（'+m+'）';
    else if(/timeout|abort/i.test(m))hint='连接超时，请检查网络或稍后再试';
    return {ok:false,ms:Date.now()-t0,msg:'请求失败：'+hint};}
}

function b64encode(str){
  const bytes=new TextEncoder().encode(str);let bin='';
  for(let i=0;i<bytes.length;i+=0x8000)
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
/* native：chunks.jsonl 分片传给 Java，由 Java 连同 library/files 打包（高效处理大附件） */
async function nativeExportKbPackage(){
  const live=notes.filter(n=>!n.trashed);
  const allCh=(await KB.allChunks()).filter(c=>live.some(n=>n.id===c.noteId));
  const manifest=await kbManifest(live,allCh);
  await Native.call('kbChunksBegin');
  const jsonl=allCh.map(c=>JSON.stringify(c)).join('\n');
  for(let k=0;k<jsonl.length;k+=900000)
    await Native.call('kbChunksPart',
      JSON.stringify({b64:b64encode(jsonl.slice(k,k+900000))}));
  const kr=await Native.call('exportKbPackage',JSON.stringify(manifest));
  toast(kr&&kr.path?('已保存到 '+kr.path):'知识库包已导出');
}
async function exportKbPackage(){
  /* 导出前补齐附件 md（确定性解析，图片除外） */
  let st=false;
  await ensureAllExportMd(o=>{if(!st){TaskUI.begin('准备知识库',o.total);st=true;}
    TaskUI.update(o.i-1,'解析附件 '+o.i+'/'+o.total);});
  if(st){TaskUI.update(1,'准备完成');setTimeout(()=>TaskUI.end(),300);}
  if(Store.env==='native'){try{await nativeExportKbPackage();}catch(e){if(e)toast(e);}return;}
  /* 切片未构建也能导出：chunks.jsonl 留空，之后可重建 */
  toast('正在打包完整备份…');
  try{
    window.__estep='zip';
    const zip=new JSZip();
    const live=notes.filter(n=>!n.trashed);window.__estep='live';
    const allCh=(await KB.allChunks()).filter(c=>live.some(n=>n.id===c.noteId));
    window.__estep='allCh '+allCh.length;
    zip.file('manifest.json',JSON.stringify(await kbManifest(live,allCh),null,2));
    window.__estep='man';
    zip.file('library.json',Store.payload());window.__estep='lib';
    zip.file('chunks.jsonl',allCh.map(c=>JSON.stringify(c)).join('\n'));window.__estep='cj';
    const fd=zip.folder('files');
    for(const n of live)for(const f of n.files||[]){
      window.__estep='att '+f.id+' '+(f.name||'');
      const b=await attachmentBlob(f).catch(e=>{window.__estep='attErr '+String(e);return null;});
      window.__estep='attOk '+f.id+' '+(b?b.size:0);
      if(b)fd.folder(f.id).file(safeName(f.name),b);
    }
    window.__estep='gen';
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',
      compressionOptions:{level:6}});
    window.__estep='genok '+blob.size;
    const url=URL.createObjectURL(blob);
    downloadURL(url,kbFileName());
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('知识库包已导出');
  }catch(e){window.__estep='CATCH '+(e&&e.message);toast('打包失败');}
}
async function importChunksJsonl(txt){
  const items=[];
  for(const line of txt.split('\n')){
    const ln=line.trim();if(!ln)continue;
    try{const c=JSON.parse(ln);if(c&&c.id)items.push({store:'chunks',obj:c});}catch(e){}
  }
  await KB.batch(items);
}

/* 应用 library 负载，让用户选 合并 / 覆盖 */
function applyLibrary(lib,label){
  if(!lib||!Array.isArray(lib.notes)){toast('文件中没有便签数据');return;}
  const hadBackup=importBackupActive;
  const settleImport=async kind=>{
    if(hadBackup&&hasNative()){try{await Native.call(kind);}catch(e){}}
    importBackupActive=false;
  };
  openModal('<h3>导入 '+lib.notes.length+' 张便签</h3>'+
    '<p>来源：'+esc(label)+'<br><b>合并</b>：保留现有，同 ID 以导入为准；<b>覆盖</b>：清空后完全替换。</p>'+
    '<div class="modal-actions"><button class="btn-ghost" data-close>取消</button>'+
    '<button class="btn-ghost" id="uimm">合并</button>'+
    '<button class="btn-primary" id="uimo">覆盖</button></div>');
  /* 取消：附件暂换内容回滚到导入前 */
  $('#modalBox [data-close]').onclick=async()=>{
    await settleImport('rollbackImport');closeModal();
  };
  $('#uimm').onclick=async()=>{
    const m={};notes.concat(lib.notes).forEach(x=>m[x.id]=x);
    notes=Object.values(m);prefs=Object.assign(prefs,lib.prefs||{});
    markCloudDeleted(Array.isArray(lib.cloudDeleted)?lib.cloudDeleted:[]);
    migrate();persist();closeModal();renderSettings();renderChips();renderNotes();
    /* 合并：旧附件按 id 并入（并集），避免现有便签丢附件 */
    await settleImport('mergeImport');
    toast('已合并，共 '+notes.length+' 张');
    Logs.info('导入','合并（'+label+'）'+lib.notes.length+' 张');
  };
  $('#uimo').onclick=async()=>{
    notes=lib.notes;prefs=Object.assign(prefs,lib.prefs||{});
    cloudDeleted=Array.isArray(lib.cloudDeleted)?[...lib.cloudDeleted]:[];
    migrate();persist();closeModal();renderSettings();renderChips();renderNotes();
    /* 覆盖：确认使用导入附件，删除旧备份 */
    await settleImport('commitImport');
    toast('已导入 '+notes.length+' 张');
    Logs.info('导入','覆盖（'+label+'）'+lib.notes.length+' 张');
  };
}
/* zip：自动区分 知识库包（manifest+chunks）/ 备份 */
async function importZipBlob(file){
  toast('正在读取压缩包…');
  let zip;
  try{zip=await JSZip.loadAsync(file);}catch(e){toast('压缩包无法识别');
    Logs.error('导入','zip 无法识别',(e&&e.message)||String(e));return;}
  const man=zip.file('manifest.json'),lj=zip.file('library.json');
  if(!lj){toast('压缩包中没有 library.json');return;}
  let lib;
  try{lib=JSON.parse(await lj.async('string'));}catch(e){toast('library.json 解析失败');return;}
  for(const path of Object.keys(zip.files)){
    if(!path.startsWith('files/'))continue;
    const parts=path.split('/');if(parts.length<3)continue;
    const entry=zip.files[path];
    if(entry&&!entry.dir&&Store.env==='idb')
      await idbPutBlob(parts[1],await entry.async('blob')).catch(()=>{});
  }
  const cj=zip.file('chunks.jsonl');
  if(cj){const t=await cj.async('string');if(t.trim())await importChunksJsonl(t);}
  applyLibrary(lib,man?'知识库包':'备份 zip');
}
/* json：备份（含 notes） */
async function importJsonText(text,label){
  let data;
  try{data=JSON.parse(text);}catch(e){toast('JSON 无法解析');return;}
  if(data&&Array.isArray(data.notes))applyLibrary(data,label||'JSON 备份');
  else if(Array.isArray(data))applyLibrary({notes:data},label||'JSON 数组');
  else toast('未识别：JSON 需含 notes 数组');
}
/* jsonl：切片 */
async function importJsonlText(text){
  if(!text||!text.trim()){toast('文件为空');return;}
  await importChunksJsonl(text);
  toast('切片已导入');Logs.info('导入','切片 JSONL');
}

async function unifiedHandleFile(file){
  const nm=(file.name||'').toLowerCase();
  if(nm.endsWith('.zip')||nm.endsWith('.kbpkg'))return importZipBlob(file);
  if(nm.endsWith('.jsonl'))return importJsonlText(await file.text());
  if(nm.endsWith('.json'))return importJsonText(await file.text());
  toast('不支持的类型，请选择 .zip / .json / .jsonl');
}
$('#importUnified').addEventListener('change',async e=>{

async function nativeUnifiedImport(){

  if(r.kind==='lib'){

    importBackupActive=true;
    applyLibrary({notes:r.notes,prefs:r.prefs},r.label||'知识库包/备份');

      if(cr.ok)await importJsonlText(await cr.text());}catch(e){toast('切片导入失败');}

  }
}

/* ============ 白屏自愈：转场/切后台后强制重建合成层 ============
   部分 Android WebView 在转场或切后台再回来后，硬件加速层纹理丢失，
   DOM/JS 正常但画面空白（露出原生底色）。通过对当前激活页做一次
   无视觉变化的合成层切换，强制 GPU 重新提交纹理。 */
window.__forceRepaint=function(){
  try{
    const el=document.querySelector('.screen.active')||document.querySelector('#app');
    if(!el)return;
    const prev=el.style.transform;
    el.style.transform='translate3d(0,0,0)';   /* 与激活态视觉一致，无位移、无闪烁 */
    void el.offsetHeight;                      /* 强制 reflow，重建该层纹理 */
    requestAnimationFrame(()=>{el.style.transform=prev;});
  }catch(e){}
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible')window.__forceRepaint();
});
window.addEventListener('pageshow',()=>window.__forceRepaint());

/* ============================================================
   vault-fs.js —— 纸片 v16 VaultFS（M2）
   全局名 VaultFS。低层文件系统抽象：仅做目录/文件操作，不做业务索引。
   三后端：native（AndroidBridge vault* 方法）/ opfs（OPFS）/ idb（IndexedDB 虚拟 FS）。
   路径一律 vault 相对 POSIX 路径（'/' 分隔），根目录用 ''（空串）表示。
   契约：docs/VAULT-INTERFACE.md 第 1 节。方法签名/返回结构不得变更。
   ============================================================ */
(function(){
'use strict';

/* ---------- 纯函数：POSIX 路径规范化（全部后端共用，node 可直接测） ---------- */
const util = {
  /* 规范化：去前后斜杠、压缩重复斜杠、解析 . 与 ..；根目录返回 '' */
  norm(p){
    if(!p) return '';
    p = String(p).replace(/\\/g,'/').trim();
    if(!p || p==='/' ) return '';
    const out=[];
    for(const seg of p.split('/')){
      if(!seg || seg==='.') continue;
      if(seg==='..'){ out.pop(); continue; }
      out.push(seg);
    }
    return out.join('/');
  },
  join(...parts){ return util.norm(parts.filter(x=>x!=null&&x!=='').map(String).join('/')); },
  base(p){ p=util.norm(p); if(!p) return ''; const i=p.lastIndexOf('/'); return i<0?p:p.slice(i+1); },
  dirOf(p){ p=util.norm(p); if(!p) return ''; const i=p.lastIndexOf('/'); return i<0?'':p.slice(0,i); },
  stripExt(p){ const b=util.base(p); const i=b.lastIndexOf('.'); return i<=0?b:b.slice(0,i); },
  /* 重名加序号：周会纪要.md → 周会纪要 2.md（existing 为目标目录已有文件名集合） */
  dedupeName(existing, name){
    existing = new Set(existing||[]);
    if(!existing.has(name)) return name;
    const i=name.lastIndexOf('.');
    const base = i>0 ? name.slice(0,i) : name;
    const ext  = i>0 ? name.slice(i) : '';
    let n=2; while(existing.has(base+' '+n+ext)) n++;
    return base+' '+n+ext;
  },
  /* 回收站映射：工作/周会纪要.md → .trash/工作/周会纪要.md */
  trashOf(p){ return util.join('.trash', p); },
  /* 回收路径还原：.trash/工作/周会纪要.md → 工作/周会纪要.md */
  restoreOf(trashP){ const n=util.norm(trashP); return n.indexOf('.trash/')===0 ? n.slice(7) : n; },
  /* 附件落目录：attachments/<笔记名>/（笔记路径传 '工作/周会纪要.md' → attachments/周会纪要/） */
  attachDir(notePath){ notePath=util.norm(notePath||''); return util.join('attachments', notePath?util.stripExt(notePath):'未命名'); },
  /* 原子写临时名：工作/周会纪要.md → 工作/.周会纪要.md.tmp（同父目录隐藏文件，写完 rename） */
  tmpPath(p){ p=util.norm(p); const d=util.dirOf(p), b=util.base(p); return util.join(d, '.'+b+'.tmp'); }
};

/* ---------- 浏览器字节工具（node 单测不会触达） ---------- */
function b64ToBlob(b64, type){
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:type||'application/octet-stream'});
}
function blobToB64(blob){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(',')[1]||'');
    fr.onerror=()=>rej(new Error('二进制读取失败'));
    fr.readAsDataURL(blob);
  });
}
function envNative(){ return !!(typeof window!=='undefined' && window.AndroidBridge && window.AndroidBridge.post); }
function envOpfs(){ return !!(typeof navigator!=='undefined' && navigator.storage && navigator.storage.getDirectory); }
function err(msg){ return new Error(msg); }

/* ============================================================
   后端 A：native（经 Native.call 调原生 vault* 方法）
   ============================================================ */
const nativeBE = {
  _call(method, payload){
    if(typeof Native==='undefined' || !Native.call) return Promise.reject(err('原生桥不可用'));
    return Native.call(method, payload==null?{}:payload);
  },
  root(){ return this._call('vaultRoot'); },
  list(rel){ return this._call('vaultList',{path:rel||''}); },
  read(rel){ return this._call('vaultRead',{path:rel}); },
  async write(rel, text){ await this._call('vaultWrite',{path:rel, text:String(text==null?'':text)}); return rel; },
  async mkdir(rel){ await this._call('vaultMkdir',{path:rel}); return rel; },
  async rename(rel, newRel){ await this._call('vaultRename',{path:rel, newPath:newRel}); return newRel; },
  /* 移动到文件夹：原生自行拼接目标并返回新路径 */
  async move(rel, dirRel){ return this._call('vaultMove',{path:rel, dirPath:dirRel}); },
  async trash(rel){ const r=await this._call('vaultTrash',{path:rel}); return r.trashPath; },
  async restore(rel){ const r=await this._call('vaultRestore',{path:rel}); return r.path; },
  listTrash(){ return this._call('vaultListTrash'); },
  async delete(rel){ await this._call('vaultDelete',{path:rel}); },
  async readBlob(rel){
    const r=await this._call('vaultReadBlob',{path:rel});
    return b64ToBlob(r.b64||'', r.type||'application/octet-stream');
  },
  async writeAttachment(name, blob, notePath){
    const b64=await blobToB64(blob);
    return this._call('vaultWriteAttachment',{notePath:notePath||'', name:name||'附件', b64});
  },
  importFile(uri, dirRel){ return this._call('vaultImportFile',{uri:uri, dirPath:dirRel||''}); },
  bindFolder(){ return this._call('vaultBindFolder'); },
  exportZip(){ return this._call('vaultExport',{}); }
};

/* ============================================================
   后端 B：opfs（navigator.storage.getDirectory）—— 浏览器预览/验收用
   ============================================================ */
const opfsBE = {
  async _root(){ return navigator.storage.getDirectory(); },
  async _resolve(rel, create){
    let d=await this._root();
    if(!rel) return d;
    for(const part of rel.split('/')){
      if(!part) continue;
      d=await d.getDirectoryHandle(part, {create:!!create});
    }
    return d;
  },
  async _parentOf(rel, create){
    return this._resolve(util.dirOf(rel), create);
  },
  root(){ return this._root().then(()=>({type:'opfs', path:'opfs://vault'})); },
  async list(rel){
    const d=await this._resolve(rel);
    const out=[];
    for await (const [name, handle] of d.entries()){
      if(!rel && name==='.trash') continue;
      const isDir=handle.kind==='directory';
      let size=0, mtime=0;
      if(!isDir){ const f=await handle.getFile(); size=f.size; mtime=f.lastModified; }
      out.push({name, type:isDir?'folder':'file', size, mtime});
    }
    return out;
  },
  async read(rel){
    const d=await this._parentOf(rel);
    const h=await d.getFileHandle(util.base(rel));
    return (await h.getFile()).text();
  },
  async _writeBytes(rel, bytes){
    const parent=await this._parentOf(rel, true);
    const name=util.base(rel);
    /* 原子写：先写 .name.tmp，再 move 覆盖目标 */
    const tmp=await parent.getFileHandle('.'+name+'.tmp',{create:true});
    const tw=await tmp.createWritable(); await tw.write(bytes); await tw.close();
    try{ await parent.removeEntry(name); }catch(e){}
    try{ await tmp.move(parent, name); }
    catch(e){
      const f=await tmp.getFile();
      const h=await parent.getFileHandle(name,{create:true});
      const w=await h.createWritable(); await w.write(await f.arrayBuffer()); await w.close();
      await parent.removeEntry('.'+name+'.tmp');
    }
  },
  async write(rel, text){ await this._writeBytes(rel, new TextEncoder().encode(String(text==null?'':text))); return rel; },
  async mkdir(rel){ await this._resolve(rel, true); return rel; },
  async moveRaw(srcRel, dstRel){
    const sParent=await this._parentOf(srcRel);
    const dParent=await this._parentOf(dstRel, true);
    const sName=util.base(srcRel), dName=util.base(dstRel);
    let handle;
    try{ handle=await sParent.getDirectoryHandle(sName); }
    catch(e){ handle=await sParent.getFileHandle(sName); }
    try{ await handle.move(dParent, dName); return; }
    catch(e){ /* 兜底：拷贝 + 删除（目录递归） */ }
    await this._copyTree(handle, dParent, dName);
    await sParent.removeEntry(sName, {recursive:true});
  },
  async _copyTree(srcHandle, dstParent, dstName){
    if(srcHandle.kind==='file'){
      const h=await dstParent.getFileHandle(dstName,{create:true});
      const w=await h.createWritable(); await w.write(await srcHandle.getFile()); await w.close();
      return;
    }
    const nd=await dstParent.getDirectoryHandle(dstName,{create:true});
    for await (const [name, child] of srcHandle.entries()) await this._copyTree(child, nd, name);
  },
  async rename(rel, newRel){ await this.moveRaw(rel, newRel); return newRel; },
  async delete(rel){
    const parent=await this._parentOf(rel);
    await parent.removeEntry(util.base(rel), {recursive:true});
  },
  async readBlob(rel){
    const d=await this._parentOf(rel);
    const h=await d.getFileHandle(util.base(rel));
    return h.getFile();
  },
  async writeBlob(rel, blob){ await this._writeBytes(rel, await blob.arrayBuffer()); return rel; },
  importFile(){ return Promise.reject(err('浏览器预览端不支持外部 uri 导入')); },
  bindFolder(){ return Promise.reject(err('浏览器预览端不支持绑定 SAF 目录')); },
  exportZip(){ return Promise.reject(err('浏览器预览端不支持整库导出（请用原生端）')); }
};

/* ============================================================
   后端 C：idb（IndexedDB 虚拟 FS）—— 兜底
   ============================================================ */
const idbBE = {
  db:null, NAME:'zhipian-vaultfs',
  async init(){
    this.db=await new Promise((res,rej)=>{
      const rq=indexedDB.open(this.NAME,1);
      rq.onupgradeneeded=e=>{ const db=e.target.result;
        if(!db.objectStoreNames.contains('files')) db.createObjectStore('files'); };
      rq.onsuccess=e=>res(e.target.result);
      rq.onerror=()=>rej(rq.error);
    });
    return this.db;
  },
  _store(mode){ return this.db.transaction('files',mode).objectStore('files'); },
  _op(mode, fn){
    return new Promise((res,rej)=>{
      const st=this._store(mode); const r=fn(st);
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    });
  },
  _get(k){ return this._op('readonly',s=>s.get(k)); },
  _put(k,v){ return this._op('readwrite',s=>s.put(v,k)); },
  _del(k){ return this._op('readwrite',s=>s.delete(k)); },
  _keys(){ return this._op('readonly',s=>s.getAllKeys()); },
  root(){ return Promise.resolve({type:'idb', path:'idb://'+this.NAME}); },
  async list(rel){
    const keys=await this._keys();
    const prefix=rel?rel+'/':'';
    const out=[];
    for(const k of keys){
      if(!k.startsWith(prefix)) continue;
      const rest=k.slice(prefix.length);
      if(!rest || rest.indexOf('/')>=0) continue;
      if(!rel && rest==='.trash') continue;
      const e=await this._get(k);
      out.push({name:rest, type:e.kind, size:e.blob?e.blob.size:0, mtime:e.mtime||0});
    }
    return out;
  },
  async read(rel){
    const e=await this._get(rel);
    if(!e) throw err('文件不存在：'+rel);
    return e.blob.text();
  },
  async write(rel, text){
    await this._put(rel, {kind:'file', blob:new Blob([String(text==null?'':text)],{type:'text/plain'}), mtime:Date.now()});
    return rel;
  },
  async mkdir(rel){
    if(!rel) return rel;
    const segs=rel.split('/'); let acc='';
    for(const s of segs){ acc=acc?acc+'/'+s:s; await this._put(acc,{kind:'folder', mtime:Date.now()}); }
    return rel;
  },
  async moveRaw(srcRel, dstRel){
    const keys=await this._keys();
    const moved=[];
    for(const k of keys){
      if(k===srcRel || k.indexOf(srcRel+'/')===0){
        const nk=util.join(dstRel, k.slice(srcRel.length));
        const e=await this._get(k);
        moved.push([k,nk,e]);
      }
    }
    if(!moved.length) throw err('移动源不存在：'+srcRel);
    for(const [k,nk,e] of moved){ await this._put(nk,e); await this._del(k); }
  },
  async rename(rel,newRel){ await this.moveRaw(rel,newRel); return newRel; },
  async delete(rel){
    const keys=await this._keys();
    for(const k of keys) if(k===rel || k.indexOf(rel+'/')===0) await this._del(k);
  },
  async readBlob(rel){
    const e=await this._get(rel);
    if(!e) throw err('文件不存在：'+rel);
    return e.blob;
  },
  async writeBlob(rel,blob){
    await this._put(rel,{kind:'file', blob, mtime:Date.now()});
    return rel;
  },
  importFile(){ return Promise.reject(err('浏览器预览端不支持外部 uri 导入')); },
  bindFolder(){ return Promise.reject(err('浏览器预览端不支持绑定 SAF 目录')); },
  exportZip(){ return Promise.reject(err('浏览器预览端不支持整库导出（请用原生端）')); }
};

/* ---------- 回收站/恢复/附件 的通用算法（opfs/idb 后端用；native 由原生实现） ---------- */
async function genericTrash(be, rel){
  await be.mkdir(util.dirOf(util.trashOf(rel)));
  const parent=util.dirOf(util.trashOf(rel));
  const names=(await be.list(parent)).map(e=>e.name);
  const target=util.join(parent, util.dedupeName(names, util.base(util.trashOf(rel))));
  await be.moveRaw(rel, target);
  return target;
}
async function genericRestore(be, trashRel){
  if(!util.restoreOf(trashRel)) throw err('不是回收站路径：'+trashRel);
  const orig=util.restoreOf(trashRel);
  const parent=util.dirOf(orig);
  if(parent) await be.mkdir(parent);
  const names=(await be.list(parent)).map(e=>e.name);
  const target=util.join(parent, util.dedupeName(names, util.base(orig)));
  await be.moveRaw(trashRel, target);
  return target;
}
async function genericListTrash(be){
  const out=[];
  async function walk(rel){
    let entries=[];
    try{ entries=await be.list(rel); }catch(e){ return; }
    for(const e of entries){
      const full=util.join(rel, e.name);
      if(e.type==='folder') await walk(full);
      out.push({name:e.name, type:e.type, size:e.size, mtime:e.mtime,
                originalPath:util.restoreOf(full)});
    }
  }
  await walk('.trash');
  return out;
}
async function genericWriteAttachment(be, name, blob, notePath){
  const dir=util.attachDir(notePath);
  await be.mkdir(dir);
  const names=(await be.list(dir)).map(e=>e.name);
  const finalName=util.dedupeName(names, name||'附件');
  await be.writeBlob(util.join(dir, finalName), blob);
  return util.join(dir, finalName);
}

/* ============================================================
   VaultFS 对外门面
   ============================================================ */
const VaultFS = {
  _be:null, _name:null,
  /* 后端自动选择：native > opfs > idb；force 仅供测试/开发强制指定 */
  async init(force){
    this._name = force || (envNative()?'native':(envOpfs()?'opfs':'idb'));
    if(this._name==='native') this._be=nativeBE;
    else if(this._name==='opfs') this._be=opfsBE;
    else { this._be=idbBE; await idbBE.init(); }
    return this._name;
  },
  backend(){ return this._name || (envNative()?'native':(envOpfs()?'opfs':'idb')); },
  root(){ return this._be.root(); },
  list(path){ return this._be.list(util.norm(path)); },
  read(path){ return this._be.read(util.norm(path)); },
  write(path, text){ return this._be.write(util.norm(path), text); },
  mkdir(path){ return this._be.mkdir(util.norm(path)); },
  rename(path, newPath){ return this._be.rename(util.norm(path), util.norm(newPath)); },
  async move(path, dirPath){
    path=util.norm(path); dirPath=util.norm(dirPath);
    if(this._be.move) return this._be.move(path, dirPath);
    const newPath=util.join(dirPath, util.base(path));
    await this._be.rename(path, newPath);
    return newPath;
  },
  trash(path){
    path=util.norm(path);
    if(this._name==='native') return this._be.trash(path);
    return genericTrash(this._be, path);
  },
  restore(trashPath){
    trashPath=util.norm(trashPath);
    if(this._name==='native') return this._be.restore(trashPath);
    return genericRestore(this._be, trashPath);
  },
  listTrash(){
    if(this._name==='native') return this._be.listTrash();
    return genericListTrash(this._be);
  },
  delete(path){ return this._be.delete(util.norm(path)); },
  readBlob(path){ return this._be.readBlob(util.norm(path)); },
  writeAttachment(name, blob, notePath){
    notePath=util.norm(notePath||'');
    if(this._name==='native') return this._be.writeAttachment(name, blob, notePath);
    return genericWriteAttachment(this._be, name, blob, notePath);
  },
  importFile(uri, dirPath){ return this._be.importFile(uri, util.norm(dirPath||'')); },
  bindFolder(){ return this._be.bindFolder(); },
  exportZip(uri){ return this._be.exportZip(uri||''); },
  /* 暴露纯函数工具，供 node 单测与 Vault 业务层复用 */
  util
};

/* 浏览器内挂全局；node 测试环境导出（浏览器内不报错） */
if(typeof window!=='undefined') window.VaultFS=VaultFS;
if(typeof module!=='undefined' && module.exports) module.exports=VaultFS;

/* ============================================================
   markdown.js —— 纸片 v16 完整 Markdown 引擎（M3）
   全局名 MD。方法签名严格遵循 docs/VAULT-INTERFACE.md 第 3 节。
   方言 = Obsidian 兼容子集：
     标题 ##~######（# 不用于正文标题） / **粗** / *斜* / ==高亮== /
     <u>下划</u> / ~~删除~~ / `行内码` / ```代码块``` / >引用 /
     - 无序列表 / 1. 有序列表 / ---分割线（frontmatter 之外） /
     - [ ] / - [x] 待办（#p/high #p/low 优先级，缩进子任务） /
     图片 ![](path) 与 ![[path]] / 其他附件 [名](path) /
     双链 [[名]]（支持 [[名|显示]]） / 行内标签 #标签。
   浏览器经典脚本挂载 window.MD；node 下 module.exports=MD 便于单测。
   ============================================================ */
(function(){
'use strict';

/* ---------------- 工具 ---------------- */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s){
  return esc(s).replace(/"/g,'&quot;');
}
function decodeEntities(s){
  return String(s==null?'':s)
    .replace(/&nbsp;/g,' ')
    .replace(/&quot;/g,'"')
    .replace(/&#39;/g,"'")
    .replace(/&lt;/g,'<')
    .replace(/&gt;/g,'>')
    .replace(/&amp;/g,'&');
}

/* ================= frontmatter =================
   parseFrontmatter(text) → {fm:Object|null, body:string}
   无 frontmatter 时 fm=null，body 原样返回。 */
function parseFrontmatter(text){
  if(!text) return { fm:null, body:'' };
  const m = text.match(/^---[ \t]*\r?\n([\s\S]*?)\r?\n?---[ \t]*\r?\n?/);
  if(!m) return { fm:null, body:text };
  const raw = m[1];
  const body = text.slice(m[0].length);
  const fm = {};
  raw.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const mm = line.match(/^\s*([A-Za-z_][\w.-]*)\s*:\s*(.*)$/);
    if(!mm) return;
    const key = mm[1];
    let val = mm[2].trim();
    if(val === ''){ fm[key] = ''; return; }
    if(val.startsWith('[') && val.endsWith(']')){
      val = val.slice(1,-1);
      fm[key] = val ? val.split(',').map(s=>unquote(s.trim())).filter(s=>s!=='') : [];
    } else {
      fm[key] = parseScalar(val);
    }
  });
  return { fm, body, _headerStr: m[0] };
}
function unquote(s){ return s.replace(/^["']|["']$/g,''); }
function parseScalar(val){
  const v = unquote(val);
  if(val.startsWith('"') || val.startsWith("'")) return v; // 显式引号一律按字符串
  if(v === 'true') return true;
  if(v === 'false') return false;
  if(v === 'null' || v === '~') return null;
  if(v !== '' && !isNaN(Number(v))) return Number(v);
  return v;
}

/* stringifyFrontmatter(fm) → YAML 头部（含首尾 ---）；空 fm 返回 '' */
const FM_ORDER = ['id','created','updated','color','pinned','tags','type'];
function stringifyFrontmatter(fm){
  const keys = Object.keys(fm||{});
  if(!keys.length) return '';
  const ordered = keys.slice().sort((a,b)=>{
    const ia = FM_ORDER.indexOf(a), ib = FM_ORDER.indexOf(b);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  const lines = ordered.map(k=>{
    let v = fm[k];
    if(v == null) v = '';
    if(Array.isArray(v)){
      v = '[' + v.map(x=>yamlScalar(x)).join(', ') + ']';
    } else {
      v = yamlScalar(v);
    }
    return k + ': ' + v;
  });
  return '---\n' + lines.join('\n') + '\n---\n';
}
function yamlScalar(v){
  if(typeof v === 'boolean') return v ? 'true' : 'false';
  if(typeof v === 'number') return String(v);
  const s = String(v);
  // 含冒号/井号/以特殊符起头/留空含义的值需要引号
  if(s === '' || /[:#\[\]{}&*!|>'"%@`,]/.test(s) || /^(true|false|null|~)$/i.test(s) || /^\s|\s$/.test(s)){
    return '"' + s.replace(/"/g,'\\"') + '"';
  }
  return s;
}

/* ================= 行内渲染（MD→HTML） ================= */
function inline(t){
  const stash = [];
  const put = html => { stash.push(html); return '\u0001' + (stash.length-1) + '\u0002'; };

  // 1) 行内码 `x`（先抽，内部不再解析任何标记）
  t = t.replace(/`([^`]*)`/g, (m,c)=> put('<code class="md-code">'+esc(c)+'</code>'));
  // 2) 原始 HTML 下划线 <u>x</u>
  t = t.replace(/<u>([\s\S]*?)<\/u>/gi, (m,c)=> put('<u>'+esc(c)+'</u>'));
  // 3) Obsidian 内嵌图片 ![[path]]
  t = t.replace(/!\[\[([^\]]*)\]\]/g, (m,a)=>
    put('<img class="md-img" src="attachments/'+encodeURI(a)+'" alt="'+escAttr(a)+'">'));
  // 4) 标准图片 ![alt](url)
  t = t.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m,a,url)=>
    put('<img class="md-img" src="'+escAttr(url)+'" alt="'+escAttr(a)+'">'));
  // 5) 链接 [文字](url)（文字允许嵌套行内标记，递归解析）
  t = t.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m,txt,url)=>
    put('<a class="md-link" href="'+escAttr(url)+'">'+inline(txt)+'</a>'));
  // 6) 双链 [[名]] / [[名|显示]]
  t = t.replace(/\[\[([^\]|]+)(?:\|([^\]]*))?\]\]/g, (m,name,disp)=>
    put('<span class="md-wiki" data-target="'+escAttr(name)+'">'+esc(disp||name)+'</span>'));

  // 7) 其余文本转义
  t = esc(t);
  // 8) 高亮 ==x==
  t = t.replace(/==([^=\s][^=]*)==/g, '<mark class="md-hl">$1</mark>');
  // 9) 删除线 ~~x~~
  t = t.replace(/~~([\s\S]+?)~~/g, '<del>$1</del>');
  // 10) 加粗 **x**（先于斜体，避免吃掉星号）
  t = t.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
  // 11) 斜体 *x*（紧贴非单词边界）
  t = t.replace(/(^|[^\w*])\*([^*\s][^*]*?)\*(?=[^\w*]|$)/g, '$1<em>$2</em>');
  // 12) 行内标签 #标签（跳过优先级 #p/high #p/low 与 URL 残留）
  t = t.replace(/(^|\s)#([\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9_/-]*)/g, (m,pre,tag)=>{
    if(/^(p\/high|p\/low)$/.test(tag)) return m;
    return pre + '<span class="md-tag">#' + tag + '</span>';
  });

  // 13) 还原占位
  t = t.replace(/\u0001(\d+)\u0002/g, (m,i)=>stash[+i]);
  return t;
}

/* 待办行展示 HTML（剥离优先级标签后渲染文本） */
function todoRowHTML(indent, done, text){
  const pr = (text.match(/#p\/(high|low)/)||[])[1] || '';
  const clean = text.replace(/#p\/(high|low)/g,'').trim();
  return '<div class="md-todo'+(done?' done':'')+(pr?' p-'+pr:'')+'" data-done="'+(done?1:0)+'" style="margin-left:'+(indent*2)+'em">'
    +'<span class="md-todo-box">'+(done
        ?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        :'')+'</span>'
    +'<span class="md-todo-text">'+inline(clean)+'</span></div>';
}

/* ================= 块级：parse(md) → {fm, blocks} ================= */
function parse(md){
  const { fm, body } = parseFrontmatter(md||'');
  const lines = body.split(/\r?\n/);
  const blocks = [];
  let i = 0;
  while(i < lines.length){
    let line = lines[i];

    // 代码块 ```lang
    const fence = line.match(/^```([\w+-]*)\s*$/);
    if(fence){
      const code = []; i++;
      while(i < lines.length && !/^```\s*$/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; // 跳过收尾 ```
      blocks.push({ type:'code', lang:fence[1]||'', text:code.join('\n') });
      continue;
    }
    // 分割线 ---（frontmatter 已剥离，此处一定是 hr）
    if(/^\s{0,3}---\s*$/.test(line)){ blocks.push({ type:'hr' }); i++; continue; }
    // 引用 >
    if(/^>\s?/.test(line)){
      const items = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ items.push(lines[i].replace(/^>\s?/,'')); i++; }
      blocks.push({ type:'quote', items });
      continue;
    }
    // 标题 ##~######
    const h = line.match(/^(#{2,6})\s+(.*)$/);
    if(h){ blocks.push({ type:'heading', level:h[1].length, text:h[2].trim() }); i++; continue; }
    // 待办 - [ ] / - [x]
    const td = line.match(/^(\s*)- \[([ xX])\]\s+(.*)$/);
    if(td){
      const priority = /#p\/high/.test(td[3]) ? 'high' : /#p\/low/.test(td[3]) ? 'low' : 'normal';
      blocks.push({ type:'todo', indent:td[1].length, done:td[2].toLowerCase()==='x', priority, text:td[3] });
      i++; continue;
    }
    // 无序列表（非待办的 - ）
    const ul = line.match(/^(\s*)-\s+(.*)$/);
    if(ul){
      const items = [{ indent:ul[1].length, text:ul[2] }]; i++;
      while(i < lines.length){
        const m2 = lines[i].match(/^(\s*)-\s+(.*)$/);
        if(!m2) break;
        items.push({ indent:m2[1].length, text:m2[2] }); i++;
      }
      blocks.push({ type:'ul', items });
      continue;
    }
    // 有序列表 1.
    const ol = line.match(/^(\s*)(\d+)\.\s+(.*)$/);
    if(ol){
      const items = [{ indent:ol[1].length, num:Number(ol[2]), text:ol[3] }]; i++;
      while(i < lines.length){
        const m2 = lines[i].match(/^(\s*)(\d+)\.\s+(.*)$/);
        if(!m2) break;
        items.push({ indent:m2[1].length, num:Number(m2[2]), text:m2[3] }); i++;
      }
      blocks.push({ type:'ol', items });
      continue;
    }
    // 空行
    if(!line.trim()){ i++; continue; }
    // 独立成行的附件/图片 → attach 块
    if(/^\s*!?\[\[?[^\]]*\]\(?[^)\s]*\)?\s*$/.test(line) && /(!?\[[^\]]*\]\(|<img|!\[\[)/.test(line)){
      blocks.push({ type:'attach', refs:extractAttachRefs(line) });
      i++; continue;
    }
    // 普通段落
    blocks.push({ type:'para', text:line });
    i++;
  }
  return { fm, blocks };
}

/* ================= MD → HTML ================= */
function toHTML(md){
  const { fm, body } = parseFrontmatter(md||'');
  const lines = body.split(/\r?\n/);
  let html = '';
  let i = 0;
  const flushList = (buf, ordered) => {
    if(!buf.length) return;
    html += (ordered?'<ol>':'<ul>') + buf.map(li=>'<li>'+li+'</li>').join('') + (ordered?'</ol>':'</ul>');
    buf.length = 0;
  };
  let ulBuf = [], olBuf = [];
  while(i < lines.length){
    const line = lines[i];
    const fence = line.match(/^```([\w+-]*)\s*$/);
    if(fence){
      flushList(ulBuf); flushList(olBuf,true);
      const code = []; i++;
      while(i < lines.length && !/^```\s*$/.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      html += '<pre class="md-pre"'+(fence[1]?' data-lang="'+escAttr(fence[1])+'"':'')+'><code>'+esc(code.join('\n'))+'</code></pre>';
      continue;
    }
    if(/^\s{0,3}---\s*$/.test(line)){ flushList(ulBuf); flushList(olBuf,true); html+='<hr class="md-hr">'; i++; continue; }
    if(/^>\s?/.test(line)){
      flushList(ulBuf); flushList(olBuf,true);
      const q = [];
      while(i < lines.length && /^>\s?/.test(lines[i])){ q.push(lines[i].replace(/^>\s?/,'')); i++; }
      html += '<blockquote class="md-quote">'+q.map(l=>'<p>'+inline(l)+'</p>').join('')+'</blockquote>';
      continue;
    }
    const h = line.match(/^(#{2,6})\s+(.*)$/);
    if(h){ flushList(ulBuf); flushList(olBuf,true);
      const lv = h[1].length; html += '<h'+lv+' class="md-h">'+inline(h[2])+'</h'+lv+'>'; i++; continue; }
    const td = line.match(/^(\s*)- \[([ xX])\]\s+(.*)$/);
    if(td){
      flushList(ulBuf); flushList(olBuf,true);
      html += todoRowHTML(td[1].length, td[2].toLowerCase()==='x', td[3]);
      i++; continue;
    }
    const ul = line.match(/^(\s*)-\s+(.*)$/);
    if(ul){ olBuf.length && flushList(olBuf,true); ulBuf.push(inline(ul[2])); i++; continue; }
    const ol = line.match(/^(\s*)\d+\.\s+(.*)$/);
    if(ol){ ulBuf.length && flushList(ulBuf); olBuf.push(inline(ol[2])); i++; continue; }
    if(!line.trim()){ flushList(ulBuf); flushList(olBuf,true); i++; continue; }
    flushList(ulBuf); flushList(olBuf,true);
    html += '<p class="md-p">'+inline(line)+'</p>';
    i++;
  }
  flushList(ulBuf); flushList(olBuf,true);
  return html || '<p class="md-p md-empty">（空笔记）</p>';
}

/* ================= 编辑器 HTML → MD =================
   覆盖富文本工具栏全元素：h1~h6 / p / strong|b / em|i / u /
   del|s|strike / mark / 行内码 / pre 代码块 / blockquote / ul|ol+li /
   li 内 checkbox（待办） / hr / img / a / span.md-wiki / <br> */
function htmlToMD(html){
  if(!html) return '';
  let s = String(html);
  s = s.replace(/<!--[\s\S]*?-->/g,'');
  s = s.replace(/<br\s*\/?>/gi,'\n');

  let out = '';
  const stack = [];                 // 块级上下文栈：'ul'|'ol'|'quote'|'wiki'
  const linkStack = [];            // {href, buf}
  let pendingLi = null;             // {type, indent, isTodo, checked}
  let preActive = false, preLang = '', preBuf = [];

  /* 输出目标：若在链接内则写入链接缓冲，否则写入主输出 */
  const emit = txt => {
    if(!txt) return;
    if(linkStack.length){ linkStack[linkStack.length-1].buf += txt; return; }
    out += txt;
  };
  /* 块间换行：引用块内换行后补 '> ' */
  const br = () => emit(stack.includes('quote') ? '\n> ' : '\n');
  const pushText = txt => {
    if(!txt) return;
    if(preActive){ preBuf.push(decodeEntities(txt)); return; }
    let t = decodeEntities(txt);
    if(stack.includes('quote')) t = t.replace(/\n/g,'\n> ');
    // 列表项首次有内容时，补出 - / 1. / - [ ] 前缀
    if(pendingLi){
      const indent = '  '.repeat(pendingLi.indent);
      const sep = out.endsWith('\n') ? '' : '\n';
      emit(sep + indent +
        (pendingLi.isTodo
          ? '- ['+(pendingLi.checked?'x':' ')+'] '
          : (pendingLi.type==='ol' ? '1. ' : '- ')));
      pendingLi = null;
    }
    emit(t);
  };

  const tagRe = /<\/?([a-zA-Z][a-zA-Z0-9-]*)((?:[^<>]*?))\s*(\/?)>/g;
  let lastIdx = 0, m;
  while((m = tagRe.exec(s))){
    pushText(s.slice(lastIdx, m.index));
    lastIdx = tagRe.lastIndex;
    const isClose = m[0][1] === '/';
    const tag = m[1].toLowerCase();
    const attrs = m[2]||'';
    const getAttr = name => {
      const a = attrs.match(new RegExp(name+'\\s*=\\s*"([^"]*)"','i')) || attrs.match(new RegExp(name+"\\s*=\\s*'([^']*)'",'i'));
      return a ? a[1] : null;
    };

    if(preActive){
      if(tag === 'pre' && isClose){
        preActive = false;
        const inner = preBuf.join('').replace(/<\/?code[^>]*>/gi,'');
        out += '\n```'+preLang+'\n'+inner.replace(/\n+$/,'')+'\n```\n';
      } else {
        preBuf.push(m[0]); // pre 内部标签原样保留
      }
      continue;
    }

    switch(tag){
      case 'p': case 'div':
        if(isClose) br();
        break;
      case 'h1': case 'h2': case 'h3': case 'h4': case 'h5': case 'h6': {
        let lv = Number(tag[1]);
        lv = Math.max(2, Math.min(6, lv)); // 方言：# 不用于正文标题，h1→##
        if(!isClose){ if(out && !out.endsWith('\n')) br(); emit('#'.repeat(lv)+' '); }
        else br();
        break;
      }
      case 'ul': case 'ol':
        if(!isClose) stack.push(tag);
        else { const k=stack.lastIndexOf(tag); if(k>=0)stack.splice(k,1); br(); }
        break;
      case 'li': {
        if(!isClose){
          const depth = stack.filter(x=>x==='ul'||x==='ol').length;
          const type = stack[stack.length-1]==='ol' ? 'ol' : 'ul';
          pendingLi = { type, indent: Math.max(0, depth-1), isTodo:false, checked:false };
        } else {
          if(pendingLi){ // 空 li
            const indent = '  '.repeat(pendingLi.indent);
            emit('\n' + indent +
              (pendingLi.isTodo ? '- ['+(pendingLi.checked?'x':' ')+'] '
                                : (pendingLi.type==='ol' ? '1. ' : '- ')));
            pendingLi = null;
          }
          br();
        }
        break;
      }
      case 'input': {
        if(pendingLi && (getAttr('type')||'checkbox').toLowerCase() === 'checkbox'){
          pendingLi.isTodo = true;
          pendingLi.checked = /checked/i.test(attrs);
        }
        break;
      }
      case 'blockquote':
        if(!isClose){ stack.push('quote'); emit('\n> '); }
        else { const k=stack.lastIndexOf('quote'); if(k>=0)stack.splice(k,1); emit('\n'); }
        break;
      case 'pre':
        if(!isClose){ preActive = true; preBuf = []; preLang = getAttr('data-lang')||getAttr('class')||'';
          const lm = preLang.match(/language-([\w+-]+)/); if(lm) preLang = lm[1]; }
        break;
      case 'code':
        emit(isClose ? '`' : '`');
        break;
      case 'strong': case 'b':           emit('**'); break;
      case 'em': case 'i':               emit('*');  break;
      case 'u':                          emit(isClose ? '</u>' : '<u>'); break;
      case 'del': case 's': case 'strike': emit('~~'); break;
      case 'mark': case 'highlight':      emit('==');  break;
      case 'hr': emit('\n---\n'); break;      case 'img': {
        const src = getAttr('src')||'', alt = getAttr('alt')||'';
        if(pendingLi){ pendingLi = null; } // 图片直接成项
        emit('!['+alt+']('+src+')');
        break;
      }
      case 'a':
        if(!isClose){ linkStack.push({ href:getAttr('href')||'', buf:'' }); }
        else {
          const lk = linkStack.pop();
          if(lk) emit('['+lk.buf+']('+lk.href+')');
        }
        break;
      case 'span':
        if(!isClose && /md-wiki/.test(attrs)){ stack.push('wiki'); emit('[['); }
        else if(isClose && stack[stack.length-1]==='wiki'){ stack.pop(); emit(']]'); }
        break;
      default: break;
    }
  }
  pushText(s.slice(lastIdx));

  // 归一化：去掉空的引用行、压缩空行
  out = out
    .split('\n')
    .filter(l => l.trim() !== '>' && l.trim() !== '> ')
    .join('\n')
    .replace(/\n{3,}/g,'\n\n')
    .replace(/[ \t]+\n/g,'\n')
    .trim();
  return out ? out + '\n' : '';
}

/* ================= AST → MD ================= */
function serialize(blocks, fm){
  // 每个块渲染成一段文本，块间空行分隔
  const seg = [];
  (blocks||[]).forEach(b=>{
    let s2 = '';
    switch(b.type){
      case 'heading': s2 = '#'.repeat(b.level) + ' ' + b.text; break;
      case 'para': s2 = b.text; break;
      case 'ul':
        s2 = b.items.map(it=>'  '.repeat(it.indent||0)+'- '+it.text).join('\n');
        break;
      case 'ol':
        s2 = b.items.map(it=>'  '.repeat(it.indent||0)+(it.num||1)+'. '+it.text).join('\n');
        break;
      case 'todo':
        s2 = '  '.repeat(b.indent||0)+'- ['+(b.done?'x':' ')+'] '+b.text;
        break;
      case 'quote':
        s2 = b.items.map(l=>'> '+(l||'')).join('\n');
        break;
      case 'code':
        s2 = '```'+(b.lang||'')+'\n'+b.text+'\n```';
        break;
      case 'hr': s2 = '---'; break;
      case 'attach':
        s2 = (b.refs||[]).map(r=>r.embed
          ? (r.link.startsWith('attachments/') ? '!['+r.alt+']('+r.link+')' : '![['+r.link+']]')
          : '['+r.alt+']('+r.link+')').join('\n');
        break;
    }
    if(s2) seg.push(s2);
  });
  const body = seg.join('\n\n') + (seg.length ? '\n' : '');
  return (fm && Object.keys(fm).length ? stringifyFrontmatter(fm) : '') + body;
}

/* ================= 待办行抽取 / 回写 ================= */
function todoLines(md){
  md = md||'';
  const parsed = parseFrontmatter(md);
  const { body } = parsed;
  const bodyStart = md.length - body.length;
  const out = [];
  let offset = 0;
  body.split(/\r?\n/).forEach((line, idx)=>{
    const m = line.match(/^(\s*)- \[([ xX])\]\s+(.*)$/);
    if(m){
      const priority = /#p\/high/.test(m[3]) ? 'high' : /#p\/low/.test(m[3]) ? 'low' : 'normal';
      out.push({
        key: String(idx),
        indent: m[1].length,
        done: m[2].toLowerCase()==='x',
        priority,
        text: m[3],
        start: bodyStart + offset,
        end: bodyStart + offset + line.length
      });
    }
    offset += line.length + 1;
  });
  return out;
}
function setTodoLine(md, key, patch){
  md = md||'';
  const parsed = parseFrontmatter(md);
  const lines = parsed.body.split(/\r?\n/);
  const idx = Number(key);
  const m = lines[idx] && lines[idx].match(/^(\s*)- \[([ xX])\]\s+(.*)$/);
  if(!m) return md;
  const done = (patch && patch.done!=null) ? !!patch.done : (m[2].toLowerCase()==='x');
  lines[idx] = m[1]+'- ['+(done?'x':' ')+'] '+m[3];
  // 保留原头部（含原始格式），仅拼接新正文
  const headerStr = parsed._headerStr || '';
  return headerStr + lines.join('\n');
}

/* ================= 索引辅助 ================= */
function extractTags(md){
  const { fm, body } = parseFrontmatter(md||'');
  const set = new Set();
  if(fm && Array.isArray(fm.tags)) fm.tags.forEach(t=>set.add(t));
  (body.match(/(^|\s)#([\u4e00-\u9fa5A-Za-z][\u4e00-\u9fa5A-Za-z0-9_/-]*)/g)||[])
    .forEach(tok=>{
      const t = tok.trim();
      const tag = t.slice(1);
      if(/^(p\/high|p\/low)$/.test(tag)) return;   // 优先级不是标签
      set.add(tag);
    });
  return Array.from(set);
}
function extractSummary(md){
  const { body } = parseFrontmatter(md||'');
  const text = body
    .replace(/```[\s\S]*?```/g,' ')
    .replace(/!\[\[[^\]]*\]\]/g,'[图]')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'[图]')
    .replace(/\[[^\]]*\]\(([^)]*)\)/g,'$1')
    .replace(/\[\[([^\]|]*)(?:\|([^\]]*))?\]\]/g, (m,n,d)=> d||n)
    .replace(/^#{1,6}\s+/gm,'')
    .replace(/^>\s?/gm,'')
    .replace(/^- \[[ xX]\]\s?/gm,'')
    .replace(/#p\/(high|low)/g,'')
    .replace(/^[-*+]\s?/gm,'')
    .replace(/^\d+\.\s?/gm,'')
    .replace(/[*_`~=]/g,'')
    .replace(/\s+/g,' ')
    .trim();
  return text.slice(0,120);
}
function extractAttachRefs(md){
  const { body } = parseFrontmatter(md||'');
  const found = [];
  let lm;
  const reEmbed = /!\[\[([^\]]*)\]\]|!\[([^\]]*)\]\(([^)\s]+)\)/g;
  while((lm = reEmbed.exec(body))){
    if(lm[1] != null) found.push({ pos:lm.index, alt:lm[1], link:lm[1], embed:true });
    else found.push({ pos:lm.index, alt:lm[2], link:lm[3], embed:true });
  }
  const reLink = /\[([^\]]*)\]\(([^)\s]+)\)/g;
  while((lm = reLink.exec(body))){
    if(body[lm.index-1] === '!') continue;
    found.push({ pos:lm.index, alt:lm[1], link:lm[2], embed:false });
  }
  found.sort((a,b)=>a.pos-b.pos);
  return found.map(({pos, ...r})=>r);
}

/* ================= 导出 ================= */
const MD = {
  parseFrontmatter, stringifyFrontmatter,
  parse, toHTML, htmlToMD, serialize,
  todoLines, setTodoLine,
  extractTags, extractSummary, extractAttachRefs
};
if(typeof window!=='undefined') window.MD = MD;
if(typeof module!=='undefined' && module.exports) module.exports = MD;
})();

/* ============================================================
   vault.js —— 纸片 v16 RealVault（M2 真实 CRUD，M3 源码模式）
   全局名 Vault。业务层：索引 / 搜索 / 树 / 写盘调度。
   建立在 VaultFS（低层文件系统）+ MD（Markdown 引擎）之上。
   严格实现 docs/VAULT-INTERFACE.md 第 2 节全部方法。
   路径一律 vault 相对 POSIX 路径，根目录用 ''（空串）。
   ============================================================ */
(function(){
'use strict';

/* 纯函数工具（VaultFS.util 在浏览器拼接时已就绪；node 单测时由测试文件注入 global.VaultFS） */
const U = (typeof VaultFS!=='undefined' && VaultFS.util) ? VaultFS.util : {
  norm(p){ if(!p) return ''; p=String(p).replace(/\\/g,'/').trim(); if(!p||p==='/') return '';
    const out=[]; for(const seg of p.split('/')){ if(!seg||seg==='.') continue;
      if(seg==='..'){ out.pop(); continue; } out.push(seg); } return out.join('/'); },
  join(...parts){ return U.norm(parts.filter(x=>x!=null&&x!=='').map(String).join('/')); },
  base(p){ p=U.norm(p); if(!p) return ''; const i=p.lastIndexOf('/'); return i<0?p:p.slice(i+1); },
  dirOf(p){ p=U.norm(p); if(!p) return ''; const i=p.lastIndexOf('/'); return i<0?'':p.slice(0,i); },
  stripExt(p){ const b=U.base(p); const i=b.lastIndexOf('.'); return i<=0?b:b.slice(0,i); }
};

/* ---------- 内部索引 ----------
   _entries: Map<path, Entry>  非回收站的全部 .md
   _trash:   Map<trashPath, {entry, originalPath}>
   _folders: Set<dirPath>      全部非隐藏目录（含嵌套）
   _attach:  Map<notePath, [{name, kind, url}> 附件缓存（objectURL） */
const _entries = new Map();
const _trash  = new Map();
const _folders = new Set();
const _attach = new Map();
const _saveTimers = {};   // path -> timer（save 防抖）

/* ---------- 由 md 全文构造 Entry ---------- */
function makeEntry(path, md){
  const parsed = MD.parseFrontmatter(md||'');
  const fm = parsed.fm;
  const name = U.base(path);
  const folder = U.dirOf(path);
  const title = U.stripExt(name);
  const todos = MD.todoLines(md||'');
  const now = Date.now();
  return {
    path, name, folder, title,
    type: (fm && fm.type) || 'note',
    color: (fm && fm.color) || null,
    pinned: !!(fm && fm.pinned),
    tags: (fm && Array.isArray(fm.tags)) ? fm.tags : MD.extractTags(md||''),
    summary: MD.extractSummary(md||''),
    id: (fm && fm.id) || path,
    created: fm && fm.created ? Date.parse(fm.created) || now : now,
    updated: fm && fm.updated ? Date.parse(fm.updated) || now : now,
    mtime: fm && fm.updated ? Date.parse(fm.updated) || now : now,
    todoTotal: todos.length,
    todoDone: todos.filter(t=>t.done).length
  };
}

/* 重写 frontmatter（保留正文原文） */
function rewriteFM(md, newFm){
  const parsed = MD.parseFrontmatter(md||'');
  const body = parsed.body || md || '';
  return MD.stringifyFrontmatter(newFm) + body;
}
function cleanFm(fm){
  const out = {};
  Object.keys(fm||{}).forEach(k=>{ if(fm[k]==null || fm[k]==='') return; out[k]=fm[k]; });
  return out;
}

/* ---------- 递归扫描建索引（一次遍历，避免重复 list） ---------- */
async function scanDir(dirPath){
  let items = [];
  try{ items = await VaultFS.list(dirPath); }catch(e){ return; }
  for(const it of items){
    if(it.name.startsWith('.')) continue;   // 隐藏文件（.trash/.tmp）跳过
    const full = U.join(dirPath, it.name);
    if(it.type==='folder'){
      _folders.add(full);
      await scanDir(full);
    } else if(/\.md$/i.test(it.name)){
      let md='';
      try{ md = await VaultFS.read(full); }catch(e){ continue; }
      _entries.set(full, makeEntry(full, md));
    }
  }
}
async function scanTrash(){
  let list=[];
  try{ list = await VaultFS.listTrash(); }catch(e){ return; }
  for(const it of list){
    if(!/\.md$/i.test(it.name)) continue;
    const full = it.originalPath ? U.join('.trash', it.originalPath) : it.name;
    let md='';
    try{ md = await VaultFS.read(full); }catch(e){ continue; }
    const entry = makeEntry(full, md);
    _trash.set(full, { entry, originalPath: it.originalPath || U.stripExt(it.name) });
  }
}

/* ---------- 索引辅助 ---------- */
function subDirs(folder){
  const out = [];
  for(const d of _folders){
    if(folder===''){ if(U.dirOf(d)==='') out.push(d); }
    else if(U.dirOf(d)===folder) out.push(d);
  }
  return out.sort();
}
/* 该目录下（含所有子目录）的笔记数 */
function notesUnder(dir){
  let n=0;
  for(const p of _entries.keys()){
    const d = U.dirOf(p);
    if(dir==='') n++;
    else if(d===dir || d.indexOf(dir+'/')===0) n++;
  }
  return n;
}
function existingNames(folder){
  const set = new Set();
  for(const p of _entries.keys()){ if(U.dirOf(p)===folder) set.add(U.base(p)); }
  for(const d of _folders){ if(U.dirOf(d)===folder) set.add(U.base(d)); }
  return set;
}

/* ============================================================
   Vault 对外门面
   ============================================================ */
const Vault = {
  /* ---- 初始化 ---- */
  async init(){

  /* ---- v15.4.4 示例 seed（转 md 落盘，按 工作/生活 分文件夹） ---- */

      { folder:'工作', name:'纸片 App 1.0 清单.md', color:'green', pinned:false, type:'todo',

      { folder:'生活', name:'随手记.md', color:'cream', pinned:false, type:'note',

  /* ---- 当前文件夹内容：文件夹置顶，其后 md（pinned 在前） ---- */
  entries(folderPath){

      type:'folder', name:U.base(d)+'/', path:d,
      title:U.base(d), count:notesUnder(d)
    }));
    const notes = Array.from(_entries.values())
      .filter(e=>e.folder===folderPath)
      .sort((a,b)=> (b.pinned-a.pinned) || (b.updated-a.updated));

  },

  /* ---- 全量嵌套树 ---- */
  tree(){
    const build = (dir)=>{
      const node = { name: dir==='' ? '资料库' : U.base(dir), path:dir, type:'folder', children:[], count:notesUnder(dir) };
      subDirs(dir).forEach(d=>node.children.push(build(d)));

    };
    return build('');
  },

  /* ---- 读单篇 ---- */
  async get(path){

  /* ---- 搜索：标题/正文/标签 ---- */
  search(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return Promise.resolve([]);
    const hits = Array.from(_entries.values()).filter(e=>{
      if(e.title.toLowerCase().includes(q)) return true;
      if(e.summary.toLowerCase().includes(q)) return true;
      if((e.tags||[]).some(t=>t.toLowerCase().includes(q))) return true;
      return false;
    });
    return Promise.resolve(hits);
  },

  /* ---- 新建文件夹 ---- */
  async createFolder(parentDir, name){
    name = (name||'').trim() || '新文件夹';
    parentDir = parentDir || '';
    let path = U.join(parentDir, name);
    /* 重名加序号 */
    const existing = existingNames(parentDir);
    if(existing.has(name+'.md') || _folders.has(path)){
      let n=2;
      while(existing.has(name+' '+n+'.md') || _folders.has(U.join(parentDir, name+' '+n))) n++;
      name = name+' '+n;
      path = U.join(parentDir, name);
    }
    await VaultFS.mkdir(path);
    _folders.add(path);
    return path;
  },

  /* ---- 新建并落盘 ---- */
  async create({ title, folder, type, content }){

    const name = U.base(U.join(folder, title+'.md'));
    const finalName = VaultFS.util ? VaultFS.util.dedupeName(existingNames(folder), name) : name;
    const path = U.join(folder, finalName);
    const fm = cleanFm({
      id: Math.random().toString(16).slice(2,10),
      created: new Date().toISOString(), updated: new Date().toISOString(),
      type: type||'note', tags: []
    });
    const md = MD.stringifyFrontmatter(fm) + (content||'');
    await VaultFS.write(path, md);
    _entries.set(path, makeEntry(path, md));

    if(folder){
      let acc='';
      for(const seg of folder.split('/')){ acc = acc?acc+'/'+seg:seg; _folders.add(acc); }
    }
    return path;
  },

  save(path, md){

      _saveTimers[path] = setTimeout(async ()=>{
        delete _saveTimers[path];
        try{
          await VaultFS.write(path, md);
          _entries.set(path, makeEntry(path, md));
        }catch(e){ console.warn('save failed', e); }
        resolve(path);
      }, 500);
    });
  },

  async flushSave(path){
    if(_saveTimers[path]){ clearTimeout(_saveTimers[path]); delete _saveTimers[path]; }

    /* 由 UI 在退出前调用 Vault.save 后再调 flush */
  },

  /* ---- 重命名（改标题=改文件名，重名加序号） ---- */
  async rename(path, title){
    title = (title||'').trim() || '未命名';
    const folder = U.dirOf(path);
    const newName = U.base(U.join(folder, title+'.md'));
    const existing = new Set(existingNames(folder));
    existing.delete(U.base(path));   // 自身不算冲突
    const finalName = VaultFS.util ? VaultFS.util.dedupeName(existing, newName) : newName;
    const newPath = U.join(folder, finalName);
    if(newPath===path) return path;
    let md='';
    try{ md = await VaultFS.read(path); }catch(e){ return path; }
    await VaultFS.rename(path, newPath);
    _entries.delete(path);
    _entries.set(newPath, makeEntry(newPath, md));

    return newPath;

    if(dirPath) await VaultFS.mkdir(dirPath);

    let md='';
    try{ md = await VaultFS.read(newPath); }catch(e){}
    _entries.delete(path);
    if(md) _entries.set(newPath, makeEntry(newPath, md));
    if(dirPath){
      let acc='';
      for(const seg of dirPath.split('/')){ acc = acc?acc+'/'+seg:seg; _folders.add(acc); }
    }
    return newPath;
  },

  /* ---- 删除（进回收站） ---- */
  async remove(path){
    const md = _entries.get(path);
    const trashPath = await VaultFS.trash(path);
    _entries.delete(path);
    let bodyMd='';
    try{ bodyMd = await VaultFS.read(trashPath); }catch(e){ bodyMd = md? MD.stringifyFrontmatter(md) : ''; }
    const entry = makeEntry(trashPath, bodyMd);
    _trash.set(trashPath, { entry, originalPath: path });
    return trashPath;
  },

  /* ---- 回收站列表 ---- */
  trashList(){
    const list = Array.from(_trash.values()).map(v=>({ entry:v.entry, originalPath:v.originalPath }));
    return Promise.resolve(list);

    let md='';
    try{ md = await VaultFS.read(orig); }catch(e){}

    if(md) _entries.set(orig, makeEntry(orig, md));
    return orig;

    return true;

  /* ---- 待办勾选回写（只改该行，立即写盘） ---- */
  async toggleTodo(path, rowKey){
    let md='';
    try{ md = await VaultFS.read(path); }catch(e){ return null; }
    const lines = MD.todoLines(md);
    const cur = lines.find(t=>t.key===String(rowKey));
    const newMd = MD.setTodoLine(md, rowKey, { done: !(cur && cur.done) });
    await VaultFS.write(path, newMd);
    _entries.set(path, makeEntry(path, newMd));
    const nl = MD.todoLines(newMd).find(t=>t.key===String(rowKey));
    return nl ? { done: nl.done, key: rowKey } : null;
  },

  /* ---- 改颜色（仅改 frontmatter，立即写盘） ---- */
  async setColor(path, color){
    let md='';
    try{ md = await VaultFS.read(path); }catch(e){ return path; }
    const parsed = MD.parseFrontmatter(md);

/* M2 起默认用真实 Vault（window.Vault）；USE_MOCK=true 时回退 mock 走查 */

const Vault = USE_MOCK ? MockVault : window.Vault;

/* ---------- 工具 ---------- */
const fmtDate = (ts)=>{ const d=new Date(ts); const p=n=>String(n).padStart(2,'0');
  return (d.getMonth()+1)+'月'+d.getDate()+'日'; };
function toast(msg){
  const t = root.querySelector('.v16-toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
